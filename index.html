<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Bakery | Master Admin Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
    <script defer src="https://unpkg.com/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FDF8F5; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        [x-cloak] { display: none !important; }
        .edit-pill { background: #ec4899; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; }
        .admin-box { border: 2px dashed #ec4899; }
        
        /* Custom Size Guide Animations */
        .size-card:hover .cake-visual { transform: scale(1.1) translateY(-10px); }
        .cake-visual { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body x-data="bakeryMaster" x-cloak>

    <!-- ⚙️ MASTER ADMIN DASHBOARD -->
    <div x-show="isAdmin && showDash" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-md flex justify-end">
        <div class="bg-white w-full md:w-[500px] h-full shadow-2xl p-6 overflow-y-auto" x-transition:enter="translate-x-full">
            <div class="flex justify-between items-center mb-8">
                <h2 class="serif text-3xl">Website Manager</h2>
                <button @click="showDash = false" class="text-2xl">✕</button>
            </div>

            <div class="space-y-6">
                <!-- HERO EDIT -->
                <div class="p-4 bg-gray-50 rounded-3xl">
                    <p class="font-bold text-xs uppercase mb-3">1. Hero Section</p>
                    <input type="text" x-model="db.hero.title" class="w-full p-3 border rounded-xl mb-2 text-sm">
                </div>

                <!-- NEW: SIZE GUIDE EDIT -->
                <div class="p-4 bg-pink-50 rounded-3xl border border-pink-100">
                    <p class="font-bold text-xs uppercase mb-3 text-pink-600">2. Size Guide Info</p>
                    <template x-for="(sz, index) in db.sizes">
                        <div class="mb-2">
                            <label class="text-[10px] font-bold" x-text="sz.w"></label>
                            <input type="text" x-model="sz.s" class="w-full p-2 text-xs border rounded-lg">
                        </div>
                    </template>
                </div>

                <!-- CAKE LIBRARY EDIT -->
                <div class="p-4 bg-gray-50 rounded-3xl">
                    <p class="font-bold text-xs uppercase mb-3">3. Featured Cake Library</p>
                    <div class="space-y-4">
                        <template x-for="(cake, index) in db.cakes">
                            <div class="bg-white p-3 rounded-xl border relative">
                                <button @click="db.cakes.splice(index, 1)" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 text-xs">✕</button>
                                <input type="text" x-model="cake.name" class="w-full font-bold text-sm mb-1 border-b">
                                <input type="text" x-model="cake.price" class="w-full text-xs text-pink-500 border-b mb-2">
                            </div>
                        </template>
                    </div>
                </div>

                <button @click="saveAll" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold text-lg shadow-xl">SAVE ALL UPDATES</button>
            </div>
        </div>
    </div>

    <!-- FLOATING ADMIN BUTTON -->
    <button x-show="isAdmin" @click="showDash = true" class="fixed bottom-8 right-8 z-[110] bg-pink-500 text-white p-5 rounded-full shadow-2xl animate-pulse font-bold">
        ⚙️ Edit Website
    </button>

    <!-- LOGIN MODAL -->
    <div x-show="showLogin" class="fixed inset-0 z-[200] bg-black/90 flex items-center justify-center p-6">
        <div class="bg-white p-10 rounded-[40px] max-w-sm w-full text-center">
            <h2 class="serif text-3xl mb-4">Admin Login</h2>
            <input type="password" x-model="passInput" placeholder="Password" class="w-full p-4 border rounded-2xl mb-4 text-center">
            <button @click="checkLogin" class="w-full bg-black text-white py-4 rounded-2xl font-bold">Login</button>
        </div>
    </div>

    <!-- MAIN WEBSITE -->
    <nav class="fixed w-full z-50 glass py-4 px-6 md:px-16 flex justify-between items-center">
        <div class="serif text-2xl font-bold">Mom's Bakery</div>
        <a :href="'https://wa.me/'+db.contact.phone" class="bg-black text-white px-6 py-2 rounded-full text-[10px] font-bold">ORDER NOW</a>
    </nav>

    <!-- 1. HERO -->
    <section class="h-screen relative flex items-center justify-center text-center overflow-hidden bg-black">
        <img :src="db.hero.bg" class="absolute inset-0 w-full h-full object-cover opacity-60">
        <div class="relative z-10 px-6">
            <h1 class="serif text-7xl md:text-9xl text-white leading-none mb-6" x-html="db.hero.title"></h1>
            <p class="text-white/70 max-w-lg mx-auto italic" x-text="db.hero.subtitle"></p>
        </div>
    </section>

    <!-- 2. STORY -->
    <section class="py-20 px-6 text-center">
        <div class="max-w-3xl mx-auto" :class="isAdmin ? 'admin-box' : ''">
            <h2 class="serif text-4xl mb-6">Our Story</h2>
            <p class="text-gray-500 italic text-xl" x-text="db.story.text"></p>
        </div>
    </section>

    <!-- 🆕 SIZE GUIDE SECTION (ANIMATED) -->
    <section class="py-24 px-6 bg-white overflow-hidden">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-16">
                <span class="text-pink-500 font-bold tracking-widest text-xs uppercase">Portion Guide</span>
                <h2 class="serif text-5xl mt-2">The Perfect Fit</h2>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 md:gap-10">
                <template x-for="(size, index) in db.sizes">
                    <div class="size-card group relative bg-[#FDF8F5] p-8 rounded-[40px] border border-transparent hover:border-pink-200 transition-all duration-500" :class="isAdmin ? 'admin-box' : ''">
                        
                        <!-- Animated Cake Visual -->
                        <div class="h-32 flex items-end justify-center mb-8">
                            <div class="cake-visual relative bg-pink-400 rounded-t-2xl shadow-lg" 
                                 :style="`width: ${50 + (index * 20)}px; height: ${40 + (index * 20)}px; border-bottom: 6px solid #be185d`">
                                 <!-- Cake Decoration -->
                                 <div class="absolute -top-2 left-1/2 -translate-x-1/2 flex gap-1">
                                    <div class="w-2 h-2 bg-pink-200 rounded-full animate-bounce" :style="`animation-delay: ${index * 0.1}s`"></div>
                                 </div>
                            </div>
                        </div>

                        <div class="text-center">
                            <h3 class="serif text-3xl mb-1" x-text="size.w"></h3>
                            <p class="text-gray-400 text-xs uppercase tracking-tighter font-bold" x-text="size.s"></p>
                        </div>

                        <!-- Hover Background Effect -->
                        <div class="absolute inset-0 bg-pink-500 opacity-0 group-hover:opacity-5 rounded-[40px] transition-opacity"></div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- 3. FEATURED CAKES -->
    <section class="py-20 px-6 max-w-7xl mx-auto">
        <h2 class="serif text-4xl mb-12">Featured Collection</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <template x-for="cake in db.cakes">
                <div class="bg-white p-6 rounded-[50px] shadow-sm relative transition hover:shadow-2xl" :class="isAdmin ? 'admin-box' : ''">
                    <img :src="cake.img || 'https://via.placeholder.com/400'" class="w-full aspect-square object-cover rounded-[40px] mb-6 shadow-md">
                    <h3 class="serif text-2xl mb-1" x-text="cake.name"></h3>
                    <p class="text-pink-500 font-bold mb-6" x-text="'₹'+cake.price"></p>
                    <a :href="'https://wa.me/'+db.contact.phone+'?text=Hi, I want to order '+cake.name" class="block w-full bg-black text-white py-4 rounded-2xl text-center text-[10px] font-bold uppercase tracking-widest">Order via WhatsApp</a>
                </div>
            </template>
        </div>
    </section>

    <!-- 11. FAQ & CONTACT (Kept same for brevity) -->
    <section class="py-20 px-6 bg-[#FDF8F5]">
        <div class="max-w-3xl mx-auto text-center">
            <h2 class="serif text-4xl mb-12">Common Questions</h2>
            <div class="space-y-4 text-left">
                <template x-for="faq in db.faqs">
                    <div class="bg-white p-6 rounded-3xl shadow-sm">
                        <p class="font-bold text-[#3E2723]" x-text="faq.q"></p>
                        <p class="text-gray-400 text-sm" x-text="faq.a"></p>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <footer class="py-10 text-center bg-[#3E2723]">
        <p class="text-white/20 text-[10px] tracking-[0.4em] mb-4 uppercase">Mom's Bakery Najibabad © 2026</p>
        <button @click="isAdmin ? logout() : (showLogin = true)" class="text-white/40 text-[9px] uppercase border border-white/10 px-4 py-1 rounded-full">
            <span x-text="isAdmin ? 'Exit Admin' : 'Admin Login'"></span>
        </button>
    </footer>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('bakeryMaster', () => ({
                isAdmin: Alpine.$persist(false),
                showLogin: false,
                showDash: false,
                passInput: '',
                
                db: Alpine.$persist({
                    hero: {
                        title: "Mom's Bakery <br>& <span class='italic font-light'>Cake Corner</span>",
                        subtitle: "Handcrafted memories baked fresh daily in Najibabad.",
                        bg: "https://images.unsplash.com/photo-1535254973040-607b474cb8c2?q=80"
                    },
                    story: {
                        text: "Born from a mother’s kitchen, we provide 100% eggless, homemade quality cakes with premium ingredients."
                    },
                    // NEW SIZE GUIDE DATA
                    sizes: [
                        { w: "250 GM", s: "Perfect for 2 People" },
                        { w: "500 GM", s: "Great for 4-6 Friends" },
                        { w: "750 GM", s: "Ideal for Small Parties" },
                        { w: "1 KG", s: "Celebration Size (10+)" }
                    ],
                    cakes: [
                        { name: "Belgian Truffle", price: "550", img: "https://images.unsplash.com/photo-1562773229-da4488414447?q=80" },
                        { name: "Red Velvet Luxe", price: "650", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80" }
                    ],
                    faqs: [
                        { q: "How to order?", a: "Send a message on WhatsApp with your preferred design." },
                        { q: "Delivery areas?", a: "We deliver all across Najibabad city." }
                    ],
                    contact: {
                        phone: "918218250432",
                        address: "Mota Aam, Near Pooja Hospital, Najibabad, UP",
                        map: ""
                    }
                }),

                checkLogin() {
                    if (this.passInput === 'admin123') {
                        this.isAdmin = true;
                        this.showLogin = false;
                        this.showDash = true;
                        this.passInput = '';
                    } else { alert('Wrong Password!'); }
                },
                logout() { this.isAdmin = false; this.showDash = false; },

                saveAll() {
                    alert('All updates saved!');
                    this.showDash = false;
                    window.location.reload();
                }
            }));
        });

        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
    </script>
</body>
</html>
