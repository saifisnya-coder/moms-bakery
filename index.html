<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomsBakery | Full Category & Admin Control</title>
    
    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FDF8F5; scroll-behavior: smooth; overflow-x: hidden;}
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        [x-cloak] { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .admin-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #eee; }
        .admin-input { border: 1px solid #ddd; padding: 10px; border-radius: 12px; width: 100%; margin-bottom: 8px; font-size: 13px; outline: none;}
        .category-btn { transition: all 0.3s ease; white-space: nowrap; border: 1px solid #eee; }
    </style>
</head>
<body x-data="bakeryApp()" x-init="init()">

    <!-- NAVIGATION -->
    <nav class="fixed w-full z-50 glass py-3 px-6 flex justify-between items-center shadow-sm">
        <div class="serif text-2xl font-bold text-[#3E2723]" x-text="site.brandName"></div>
        <div class="flex items-center gap-4">
            <button @click="showAdminLogin = true" class="text-[10px] font-bold border border-[#3E2723] px-3 py-1 rounded-full uppercase tracking-tighter">Admin Dashboard</button>
            <div class="relative cursor-pointer" @click="showCart = true">
                <span class="text-2xl">🛒</span>
                <span class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center" x-text="cartCount()"></span>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION (Admin Controlled) -->
    <section class="h-[60vh] flex items-center justify-center text-center bg-[#FFF5F5] px-6 pt-20">
        <div class="animate__animated animate__fadeIn">
            <span class="text-pink-500 font-bold tracking-[0.4em] text-[10px] uppercase block mb-2" x-text="site.heroTagline"></span>
            <h1 class="serif text-5xl md:text-7xl text-[#3E2723] mb-4" x-text="site.heroTitle"></h1>
            <p class="text-gray-500 text-sm mb-8 max-w-sm mx-auto" x-text="site.heroSubTitle"></p>
            <a href="#shop" class="bg-[#3E2723] text-white px-8 py-3 rounded-full font-bold text-sm shadow-xl">Order Now</a>
        </div>
    </section>

    <!-- 1. SHOP BY WEIGHT (Works for Cakes) -->
    <section class="py-8 bg-white border-b" x-show="activeTab === 'Cakes'">
        <div class="max-w-7xl mx-auto px-6">
            <h3 class="text-center text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4">Select Cake Weight</h3>
            <div class="flex overflow-x-auto gap-3 no-scrollbar justify-start md:justify-center">
                <template x-for="w in weights">
                    <button @click="activeWeight = w" 
                            :class="activeWeight === w ? 'bg-pink-500 text-white shadow-md' : 'bg-gray-50 text-gray-500'"
                            class="px-5 py-2 rounded-xl text-xs font-bold category-btn" x-text="w"></button>
                </template>
            </div>
        </div>
    </section>

    <!-- 2. CATEGORY TABS (Workable for all sections) -->
    <section id="shop" class="py-10 px-6 max-w-7xl mx-auto">
        <div class="flex overflow-x-auto gap-3 no-scrollbar justify-start md:justify-center mb-10 pb-2">
            <template x-for="cat in categories">
                <button @click="activeTab = cat; if(cat !== 'Cakes') activeWeight = 'All Weight'" 
                        :class="activeTab === cat ? 'bg-[#3E2723] text-white shadow-lg' : 'bg-white text-gray-400'"
                        class="px-6 py-2 rounded-full text-xs font-bold category-btn"
                        x-text="cat"></button>
            </template>
        </div>

        <!-- PRODUCT GRID (Workable dynamic filtering) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 min-h-[400px]">
            <template x-for="item in filteredItems" :key="item.id">
                <div class="bg-white p-4 rounded-[30px] shadow-sm hover:shadow-md transition-all relative animate__animated animate__fadeInUp">
                    <template x-if="item.isOutOfStock">
                        <div class="absolute inset-0 z-10 bg-white/70 backdrop-blur-[1px] flex items-center justify-center rounded-[30px]">
                            <span class="bg-black text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase">Out of Stock</span>
                        </div>
                    </template>
                    <img :src="item.image" class="w-full aspect-square object-cover rounded-[20px] mb-3">
                    <h3 class="font-bold text-sm text-[#3E2723] truncate" x-text="item.name"></h3>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-pink-600 font-bold text-sm">₹<span x-text="item.price"></span></span>
                        <span class="text-[9px] bg-gray-100 text-gray-400 px-2 py-1 rounded font-bold" x-text="item.weight"></span>
                    </div>
                    <button @click="addToCart(item)" :disabled="item.isOutOfStock" class="w-full bg-[#3E2723] text-white py-2 rounded-xl text-[10px] font-bold uppercase active:scale-95">Add to Cart</button>
                </div>
            </template>
            <!-- Empty State -->
            <template x-if="filteredItems.length === 0">
                <div class="col-span-full text-center py-20 text-gray-400">
                    <p>No items found in this section yet.</p>
                </div>
            </template>
        </div>
    </section>

    <!-- 3. SHOPPING CART -->
    <div x-show="showCart" class="fixed inset-0 z-[100] flex justify-end" x-cloak>
        <div class="absolute inset-0 bg-black/60" @click="showCart = false"></div>
        <div class="relative w-full max-w-md bg-white h-full p-8 shadow-2xl flex flex-col animate__animated animate__slideInRight">
            <div class="flex justify-between items-center mb-8">
                <h2 class="serif text-3xl">Your Order</h2>
                <button @click="showCart = false" class="bg-gray-100 w-10 h-10 rounded-full font-bold text-xl">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto no-scrollbar">
                <template x-for="(item, index) in cart" :key="index">
                    <div class="flex gap-4 mb-4 bg-gray-50 p-4 rounded-3xl">
                        <img :src="item.image" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm" x-text="item.name"></h4>
                            <p class="text-pink-500 text-xs font-bold">₹<span x-text="item.price"></span> <template x-if="item.weight !== 'N/A'"><span class="text-gray-400">| <span x-text="item.weight"></span></span></template></p>
                            <div class="flex items-center gap-3 mt-2">
                                <button @click="updateQty(index, -1)" class="w-6 h-6 bg-white rounded-full shadow text-xs">-</button>
                                <span class="text-xs font-bold" x-text="item.qty"></span>
                                <button @click="updateQty(index, 1)" class="w-6 h-6 bg-white rounded-full shadow text-xs">+</button>
                            </div>
                        </div>
                        <button @click="cart.splice(index, 1)" class="text-red-400 text-xs font-bold">Remove</button>
                    </div>
                </template>
            </div>
            <div class="mt-6 border-t pt-6">
                <div class="flex justify-between font-bold text-xl mb-6">
                    <span>Total Amount:</span>
                    <span>₹<span x-text="getCartTotal()"></span></span>
                </div>
                <button @click="checkoutWhatsApp()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg">Send Order to WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- 4. ADMIN DASHBOARD -->
    <div x-show="showAdminLogin" class="fixed inset-0 z-[110] flex items-center justify-center p-6 bg-black/90" x-cloak>
        <div class="bg-white w-full max-w-sm p-8 rounded-[40px]">
            <h2 class="serif text-2xl mb-6 text-center">Owner Login</h2>
            <input type="password" x-model="adminPassword" placeholder="Admin Password" class="admin-input text-center">
            <button @click="loginAdmin()" class="w-full bg-[#3E2723] text-white py-4 rounded-2xl font-bold">Login</button>
            <button @click="showAdminLogin = false" class="w-full mt-2 text-gray-400 text-xs">Cancel</button>
        </div>
    </div>

    <div x-show="isAdmin" class="fixed inset-0 z-[120] bg-white overflow-y-auto p-6" x-cloak>
        <div class="max-w-2xl mx-auto pb-20">
            <div class="flex justify-between items-center mb-8 border-b pb-4 sticky top-0 bg-white z-10">
                <h2 class="serif text-2xl">Management Panel</h2>
                <button @click="isAdmin = false" class="bg-red-500 text-white px-5 py-2 rounded-full text-xs font-bold">Logout</button>
            </div>

            <!-- SITE SETTINGS -->
            <div class="admin-card">
                <h3 class="font-bold text-pink-600 mb-4">1. Store Identity</h3>
                <input type="text" x-model="site.brandName" placeholder="Shop Name" class="admin-input" @input="save()">
                <input type="text" x-model="site.phone" placeholder="WhatsApp Phone" class="admin-input" @input="save()">
                <textarea x-model="site.address" placeholder="Store Address" class="admin-input" @input="save()"></textarea>
                <input type="text" x-model="site.heroTitle" placeholder="Hero Title" class="admin-input" @input="save()">
            </div>

            <!-- ADD PRODUCT -->
            <div class="admin-card">
                <h3 class="font-bold text-pink-600 mb-4">2. Add New Item</h3>
                <input type="text" x-model="newItem.name" placeholder="Item Name" class="admin-input">
                <input type="number" x-model="newItem.price" placeholder="Price (₹)" class="admin-input">
                <div class="grid grid-cols-2 gap-2">
                    <select x-model="newItem.category" class="admin-input">
                        <template x-for="cat in categories"><option :value="cat" x-text="cat"></option></template>
                    </select>
                    <select x-model="newItem.weight" class="admin-input">
                        <template x-for="w in weightList"><option :value="w" x-text="w"></option></template>
                    </select>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl text-center border-2 border-dashed mb-4">
                    <p class="text-[10px] text-gray-400 font-bold mb-2 uppercase">Pick Photo from Gallery</p>
                    <input type="file" @change="handleFileUpload" class="text-xs">
                </div>
                <button @click="addItem()" class="w-full bg-[#3E2723] text-white py-4 rounded-2xl font-bold">Add to Shop</button>
            </div>

            <!-- INVENTORY LIST -->
            <h3 class="font-bold mb-4">3. Inventory Manager</h3>
            <div class="space-y-3">
                <template x-for="item in items" :key="item.id">
                    <div class="flex items-center gap-4 bg-white border p-3 rounded-2xl">
                        <img :src="item.image" class="w-12 h-12 rounded-lg object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs" x-text="item.name"></h4>
                            <p class="text-[10px] text-gray-500">₹<span x-text="item.price"></span> | <span x-text="item.category"></span></p>
                        </div>
                        <button @click="toggleStock(item.id)" :class="item.isOutOfStock ? 'bg-red-500':'bg-green-500'" class="text-white px-3 py-1 rounded-full text-[8px] font-bold" x-text="item.isOutOfStock ? 'OUT':'IN'"></button>
                        <button @click="deleteItem(item.id)" class="text-gray-300">🗑️</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <footer class="bg-[#3E2723] text-white py-12 px-6 text-center">
        <h3 class="serif text-xl mb-2" x-text="site.brandName"></h3>
        <p class="text-xs text-gray-400 mb-6" x-text="site.address"></p>
        <div class="text-[8px] uppercase tracking-widest opacity-30">© 2026 MomsBakery Najibabad</div>
    </footer>

    <script>
        function bakeryApp() {
            return {
                isAdmin: false, showAdminLogin: false, showCart: false,
                adminPassword: '', activeTab: 'Cakes', activeWeight: 'All Weight',
                cart: [],
                categories: ['Cakes', 'Drinks', 'Bouquets', 'Watches', 'Perfumes', 'Imported'],
                weights: ['All Weight', '0.5 kg', '1 kg', '1.5 kg', '2 kg', '3 kg', 'Custom Weight'],
                weightList: ['N/A', '0.5 kg', '1 kg', '1.5 kg', '2 kg', '3 kg', 'Custom Weight'],

                site: {
                    brandName: 'MomsBakery',
                    heroTagline: 'Baking Happiness in Najibabad',
                    heroTitle: 'Handcrafted With Love',
                    heroSubTitle: 'Fresh premium cakes and designer gifts delivered to your door.',
                    phone: '918218250432',
                    address: 'Mota Aam, near Pooja Hospital, Najibabad, UP.'
                },

                items: [
                    { id: 1, name: 'Truffle Cake', price: 550, category: 'Cakes', weight: '0.5 kg', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80', isOutOfStock: false },
                    { id: 2, name: 'Luxury Rose Bouquet', price: 999, category: 'Bouquets', weight: 'N/A', image: 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80', isOutOfStock: false },
                    { id: 3, name: 'Cold Coffee Luxe', price: 150, category: 'Drinks', weight: 'N/A', image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80', isOutOfStock: false }
                ],

                newItem: { name: '', price: '', category: 'Cakes', weight: 'N/A', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80' },

                init() {
                    const savedItems = localStorage.getItem('moms_bakery_full_v5');
                    const savedSite = localStorage.getItem('moms_bakery_site_v5');
                    if(savedItems) this.items = JSON.parse(savedItems);
                    if(savedSite) this.site = JSON.parse(savedSite);
                },

                get filteredItems() {
                    return this.items.filter(item => {
                        const catMatch = item.category === this.activeTab;
                        // For cakes, we check the weight filter. For others, we just show them.
                        const weightMatch = this.activeWeight === 'All Weight' || item.weight === this.activeWeight || this.activeTab !== 'Cakes';
                        return catMatch && weightMatch;
                    });
                },

                loginAdmin() {
                    if(this.adminPassword === 'moms123') { this.isAdmin = true; this.showAdminLogin = false; this.adminPassword = ''; }
                    else alert('Access Denied');
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (f) => { this.newItem.image = f.target.result; };
                    reader.readAsDataURL(file);
                },

                addItem() {
                    if(!this.newItem.name || !this.newItem.price) return alert('Enter Details');
                    this.items.push({ ...this.newItem, id: Date.now(), isOutOfStock: false });
                    this.save();
                    this.newItem.name = ''; this.newItem.price = '';
                },

                deleteItem(id) {
                    this.items = this.items.filter(i => i.id !== id);
                    this.save();
                },

                toggleStock(id) {
                    this.items.forEach(i => { if(i.id === id) i.isOutOfStock = !i.isOutOfStock; });
                    this.save();
                },

                save() {
                    localStorage.setItem('moms_bakery_full_v5', JSON.stringify(this.items));
                    localStorage.setItem('moms_bakery_site_v5', JSON.stringify(this.site));
                },

                addToCart(item) {
                    let existing = this.cart.find(i => i.id === item.id);
                    if(existing) existing.qty++;
                    else this.cart.push({ ...item, qty: 1 });
                    this.showCart = true;
                },

                updateQty(idx, amt) {
                    this.cart[idx].qty += amt;
                    if(this.cart[idx].qty < 1) this.cart.splice(idx, 1);
                },

                getCartTotal() { return this.cart.reduce((t, i) => t + (i.price * i.qty), 0); },
                cartCount() { return this.cart.reduce((t, i) => t + i.qty, 0); },

                checkoutWhatsApp() {
                    let msg = `*Order from ${this.site.brandName}*\n\n`;
                    this.cart.forEach(i => msg += `• ${i.name} ${i.weight !== 'N/A' ? '('+i.weight+')':''} x${i.qty} = ₹${i.price * i.qty}\n`);
                    msg += `\n*Total Amount: ₹${this.getCartTotal()}*\n\nAddress: ${this.site.address}`;
                    window.open(`https://wa.me/${this.site.phone.replace('+','')}/?text=${encodeURIComponent(msg)}`, '_blank');
                }
            }
        }
    </script>
</body>
</html>
