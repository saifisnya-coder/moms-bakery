<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOM'S BAKERY | 3D Luxury Dark-Bright Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        darkest: '#080808', 
                        bright: '#FF2D55', /* Electric Pink */
                        gold: '#FFD700',   /* Bright Gold */
                        surface: '#151515' 
                    },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #080808; color: #FFFFFF; scroll-behavior: smooth; overflow-x: hidden; }
        .glass { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        /* Animated Big Title */
        .hero-title {
            background: linear-gradient(to right, #FFD700, #FF2D55, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .card-3d { 
            background: #151515; 
            border: 1px solid rgba(255, 215, 0, 0.1); 
            transition: all 0.3s ease-out;
            transform-style: preserve-3d;
        }
        .card-3d:hover { border-color: #FF2D55; box-shadow: 0 0 30px rgba(255, 45, 85, 0.2); }
        
        .new-launch-glow { box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); border: 2px solid #FFD700; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
