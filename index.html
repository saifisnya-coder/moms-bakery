<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Mom's Bakery & Gift Corner</title>
    
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FDF8F5; scroll-behavior: smooth; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        .admin-card { border: 2px dashed #3E2723; }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="bakeryApp()" x-init="init()">

    <!-- 1. STICKY NAVIGATION -->
    <nav class="fixed w-full z-50 glass py-3 px-6 flex justify-between items-center shadow-sm">
        <div class="serif text-xl font-bold text-[#3E2723]">MomsBakery</div>
        
        <div class="hidden md:flex gap-6 text-[10px] uppercase font-bold tracking-widest text-[#3E2723]">
            <a href="#featured">Shop</a>
            <a href="#categories">Categories</a>
            <a href="#gallery">Gallery</a>
            <button @click="adminMode = !adminMode" class="text-red-500">Admin Mode</button>
        </div>

        <div class="flex items-center gap-4">
            <div class="relative cursor-pointer" @click="showWishlist = true">
                ❤️ <span class="absolute -top-2 -right-2 bg-pink-500 text-white text-[8px] rounded-full px-1" x-text="wishlist.length"></span>
            </div>
            <div class="relative cursor-pointer" @click="showCart = true">
                🛒 <span class="absolute -top-2 -right-2 bg-[#3E2723] text-white text-[8px] rounded-full px-1" x-text="cart.length"></span>
            </div>
        </div>
    </nav>

    <!-- SEARCH BAR SECTION -->
    <div class="pt-24 px-6 max-w-7xl mx-auto">
        <input type="text" x-model="searchQuery" placeholder="Search for 'Chocolate', 'Bento', 'Wedding'..." 
               class="w-full p-4 rounded-2xl border-none shadow-inner bg-white text-sm focus:ring-2 ring-pink-200">
    </div>

    <!-- 2. HERO SECTION -->
    <section class="h-[80vh] flex items-center justify-center text-center px-6 animate__animated animate__fadeIn">
        <div class="max-w-4xl">
            <span class="uppercase tracking-[0.5em] text-[10px] mb-4 block text-pink-500 font-bold">Handcrafted with Love</span>
            <h1 class="serif text-6xl md:text-8xl mb-6 text-[#3E2723]">Baking Memories <br><span class="italic font-light">Every Day</span></h1>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="#featured" class="bg-[#3E2723] text-white px-10 py-4 rounded-full font-bold text-sm hover:scale-105 transition">Browse Cakes</a>
                <a href="#custom" class="bg-white text-[#3E2723] border border-[#3E2723] px-10 py-4 rounded-full font-bold text-sm">Custom Orders</a>
            </div>
        </div>
    </section>

    <!-- 3. ADMIN PANEL (Visible only when adminMode is true) -->
    <section x-show="adminMode" x-transition class="fixed inset-0 z-[60] bg-white overflow-y-auto p-6" x-cloak>
        <div class="max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="serif text-3xl">Admin Dashboard</h2>
                <button @click="adminMode = false" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg">Close</button>
            </div>
            
            <!-- Add New Item Form -->
            <div class="bg-gray-50 p-6 rounded-3xl space-y-4 shadow-lg mb-10">
                <h3 class="font-bold">Add New Cake Item</h3>
                <input type="text" x-model="newItem.name" placeholder="Cake Name" class="w-full p-3 rounded-xl border">
                <input type="number" x-model="newItem.price" placeholder="Price (₹)" class="w-full p-3 rounded-xl border">
                <select x-model="newItem.category" class="w-full p-3 rounded-xl border">
                    <template x-for="cat in categories">
                        <option :value="cat" x-text="cat"></option>
                    </template>
                </select>
                <div class="border-2 border-dashed p-4 rounded-xl text-center">
                    <p class="text-xs text-gray-500 mb-2">Upload Photo from Phone</p>
                    <input type="file" @change="handleFileUpload" class="text-xs">
                </div>
                <button @click="addItem()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">Add Item to Shop</button>
            </div>
        </div>
    </section>

    <!-- 4. DYNAMIC CAKE GRID (Workable) -->
    <section id="featured" class="py-20 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h2 class="serif text-4xl">Our Creations</h2>
                    <p class="text-gray-400 text-sm">Freshly baked for your special moments</p>
                </div>
                <div class="flex gap-2">
                    <template x-for="cat in categories">
                        <button @click="activeCategory = cat" 
                                :class="activeCategory === cat ? 'bg-[#3E2723] text-white' : 'bg-white'"
                                class="px-4 py-2 rounded-full text-[10px] font-bold shadow-sm transition" 
                                x-text="cat"></button>
                    </template>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <template x-for="(cake, index) in filteredCakes" :key="index">
                    <div class="bg-white p-4 rounded-[30px] shadow-sm hover:shadow-xl transition-all group animate__animated animate__fadeInUp">
                        <div class="relative overflow-hidden rounded-[24px]">
                            <img :src="cake.image" class="w-full aspect-square object-cover group-hover:scale-110 transition duration-500">
                            <button @click="toggleWishlist(cake)" class="absolute top-4 right-4 bg-white/80 p-2 rounded-full" :class="isInWishlist(cake) ? 'text-red-500' : 'text-gray-400'">
                                ❤️
                            </button>
                        </div>
                        <div class="mt-4">
                            <div class="flex justify-between items-start">
                                <h3 class="serif text-lg text-[#3E2723]" x-text="cake.name"></h3>
                                <template x-if="adminMode">
                                    <button @click="deleteItem(index)" class="text-red-400 text-xs font-bold">Delete</button>
                                </template>
                            </div>
                            <p class="text-pink-500 font-bold">₹<span x-text="cake.price"></span></p>
                            
                            <div class="grid grid-cols-2 gap-2 mt-4">
                                <button @click="addToCart(cake)" class="bg-[#3E2723] text-white py-2 rounded-xl text-[10px] font-bold">ADD TO CART</button>
                                <a :href="'https://wa.me/918218250432?text=I want to order: ' + cake.name" class="bg-green-500 text-white py-2 rounded-xl text-[10px] font-bold text-center">WHATSAPP</a>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- 5. FLOATING BUTTONS -->
    <div class="fixed bottom-6 right-6 flex flex-col gap-3 z-[100]">
        <a href="tel:918218250432" class="bg-blue-600 text-white p-4 rounded-full shadow-2xl animate-bounce">📞</a>
        <a href="https://wa.me/918218250432" class="bg-green-500 text-white p-4 rounded-full shadow-2xl">💬</a>
    </div>

    <!-- 6. MODALS (Cart/Wishlist) -->
    <div x-show="showCart" class="fixed inset-0 z-[100] bg-black/50 flex justify-end" x-cloak>
        <div class="w-full max-w-md bg-white h-full p-8 overflow-y-auto animate__animated animate__slideInRight">
            <div class="flex justify-between items-center mb-8">
                <h2 class="serif text-3xl">Your Cart</h2>
                <button @click="showCart = false" class="text-2xl">&times;</button>
            </div>
            <template x-for="(item, index) in cart">
                <div class="flex gap-4 mb-4 items-center border-b pb-4">
                    <img :src="item.image" class="w-16 h-16 rounded-lg object-cover">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm" x-text="item.name"></h4>
                        <p class="text-xs text-gray-500">₹<span x-text="item.price"></span></p>
                    </div>
                    <button @click="cart.splice(index, 1)" class="text-red-500">🗑️</button>
                </div>
            </template>
            <div class="mt-10">
                <div class="flex justify-between font-bold text-xl mb-6">
                    <span>Total:</span>
                    <span>₹<span x-text="cartTotal()"></span></span>
                </div>
                <button class="w-full bg-[#3E2723] text-white py-4 rounded-2xl font-bold">PROCEED TO CHECKOUT</button>
            </div>
        </div>
    </div>

    <script>
        function bakeryApp() {
            return {
                adminMode: false,
                showCart: false,
                showWishlist: false,
                searchQuery: '',
                activeCategory: 'All',
                wishlist: [],
                cart: [],
                newItem: { name: '', price: '', category: 'Birthday Cakes', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80' },
                
                categories: ['All', 'Birthday Cakes', 'Wedding Cakes', 'Bento Cakes', 'Cupcakes', 'Brownies'],
                
                cakes: [
                    { name: 'Belgian Chocolate', price: 550, category: 'Birthday Cakes', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80' },
                    { name: 'Red Velvet Lux', price: 750, category: 'Wedding Cakes', image: 'https://images.unsplash.com/photo-1616541823729-00fe0aacd32c?q=80' },
                    { name: 'Vanilla Bento', price: 250, category: 'Bento Cakes', image: 'https://images.unsplash.com/photo-1562773229-da4488414447?q=80' },
                ],

                init() {
                    const savedCakes = localStorage.getItem('bakery_items');
                    if(savedCakes) this.cakes = JSON.parse(savedCakes);
                },

                get filteredCakes() {
                    return this.cakes.filter(cake => {
                        const matchesSearch = cake.name.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchesCat = this.activeCategory === 'All' || cake.category === this.activeCategory;
                        return matchesSearch && matchesCat;
                    });
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        this.newItem.image = f.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                addItem() {
                    if(this.newItem.name && this.newItem.price) {
                        this.cakes.push({...this.newItem});
                        this.saveData();
                        this.newItem = { name: '', price: '', category: 'Birthday Cakes', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80' };
                        alert('Cake Added Successfully!');
                    }
                },

                deleteItem(index) {
                    if(confirm('Delete this item?')) {
                        this.cakes.splice(index, 1);
                        this.saveData();
                    }
                },

                saveData() {
                    localStorage.setItem('bakery_items', JSON.stringify(this.cakes));
                },

                addToCart(cake) {
                    this.cart.push(cake);
                    alert(`${cake.name} added to cart!`);
                },

                cartTotal() {
                    return this.cart.reduce((sum, item) => sum + parseInt(item.price), 0);
                },

                toggleWishlist(cake) {
                    const index = this.wishlist.findIndex(c => c.name === cake.name);
                    if(index > -1) this.wishlist.splice(index, 1);
                    else this.wishlist.push(cake);
                },

                isInWishlist(cake) {
                    return this.wishlist.some(c => c.name === cake.name);
                }
            }
        }
    </script>
</body>
</html>
