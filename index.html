<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mom's Bakery — Freshly Baked Home Goodness</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: { 50: '#FFFDF9', 100: '#FAF4E8', 200: '#F3E8D3', 300: '#EBD8B8' },
            cocoa: { 500: '#8C5B3E', 700: '#5A3622', 800: '#3D2314', 900: '#26140A' },
            honey: { 400: '#F59E0B', 500: '#D97706', 600: '#B45309' },
            berry: { 500: '#E11D48', 600: '#BE123C', 700: '#9F1239' }
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #FFFDF9; color: #3D2314; font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #FAF4E8; }
    ::-webkit-scrollbar-thumb { background: #D97706; border-radius: 4px; }
  </style>
</head>
<body class="antialiased selection:bg-honey-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL DATA ---
    const INITIAL_MENU = [
      { id: '1', name: 'Belgian Dark Chocolate Cake', category: 'Cakes', price: 28.00, description: 'Triple-layered rich fudge sponge topped with hand-piped dark ganache.', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '2', name: 'Classic Red Velvet Cake', category: 'Cakes', price: 32.00, description: 'Moist crimson cake with vanilla bean cream cheese frosting.', image: 'https://images.unsplash.com/photo-1586788680434-30d324b2d46f?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '3', name: 'Artisanal Country Sourdough', category: 'Breads', price: 8.50, description: 'Fermented naturally for 36 hours. Blistered crust with an open airy crumb.', image: 'https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '4', name: 'Golden Brioche Buns (4 Pack)', category: 'Breads', price: 6.50, description: 'Soft, pillowy butter rolls glazed with egg wash & honey.', image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '5', name: 'Gooey Chunk Cookies (6 Pack)', category: 'Cookies', price: 12.00, description: 'Crisp edges, gooey melted centers loaded with milk and dark chocolate chunks.', image: 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '6', name: 'Vanilla Bean Cupcakes (4 Pack)', category: 'Cupcakes', price: 14.00, description: 'Light vanilla sponge frosted with real Madagascar vanilla buttercream.', image: 'https://images.unsplash.com/photo-1576618148400-f54bed99fcfd?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '7', name: 'French Almond Macarons (6 Box)', category: 'Cookies', price: 16.00, description: 'Salted caramel, pistachio, and raspberry filled almond shell cookies.', image: 'https://images.unsplash.com/photo-1569864358642-9d1684040f43?w=600&auto=format&fit=crop&q=80', isAvailable: true },
      { id: '8', name: 'Flaky Butter Croissants (3 Pack)', category: 'Pastries', price: 9.50, description: 'Layered with French butter, golden baked fresh every morning.', image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600&auto=format&fit=crop&q=80', isAvailable: true }
    ];

    const INITIAL_ORDERS = [
      {
        id: 'MB-1001',
        date: new Date().toLocaleString(),
        customer: { name: 'Sarah Jenkins', phone: '+1 (555) 234-5678', address: '742 Evergreen Terrace', paymentMethod: 'UPI', notes: 'Please ring the bell' },
        items: [{ id: '1', name: 'Belgian Dark Chocolate Cake', price: 28.00, quantity: 1 }],
        total: 31.50,
        status: 'Delivered'
      }
    ];

    // --- MAIN APPLICATION ---
    function App() {
      // Local Storage State
      const [menu, setMenu] = useState(() => JSON.parse(localStorage.getItem('mb_menu')) || INITIAL_MENU);
      const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('mb_cart')) || []);
      const [orders, setOrders] = useState(() => JSON.parse(localStorage.getItem('mb_orders')) || INITIAL_ORDERS);

      // UI Control States
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [confirmedOrder, setConfirmedOrder] = useState(null);
      
      // Admin States
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
      const [adminPass, setAdminPass] = useState('');
      const [adminTab, setAdminTab] = useState('orders'); // 'orders' | 'menu'
      const [showAdminView, setShowAdminView] = useState(false);

      // Toast State
      const [toasts, setToasts] = useState([]);

      // Forms State
      const [checkoutForm, setCheckoutForm] = useState({ name: '', phone: '', address: '', paymentMethod: 'Cash on Delivery', notes: '' });
      const [newItemForm, setNewItemForm] = useState({ name: '', category: 'Cakes', price: '', description: '', image: '' });

      // Save to localStorage
      useEffect(() => { localStorage.setItem('mb_menu', JSON.stringify(menu)); }, [menu]);
      useEffect(() => { localStorage.setItem('mb_cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { localStorage.setItem('mb_orders', JSON.stringify(orders)); }, [orders]);

      // Toast Helper
      const triggerToast = (msg, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      };

      // Cart Logic
      const addToCart = (item) => {
        if (!item.isAvailable) return triggerToast('Sorry, item is sold out!', 'error');
        setCart(prev => {
          const match = prev.find(i => i.id === item.id);
          if (match) return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
          return [...prev, { ...item, quantity: 1 }];
        });
        triggerToast(`Added ${item.name} to cart!`);
      };

      const updateQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const qty = item.quantity + delta;
            return qty > 0 ? { ...item, quantity: qty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const getItemQty = (id) => cart.find(i => i.id === id)?.quantity || 0;

      const subtotal = useMemo(() => cart.reduce((sum, item) => sum + item.price * item.quantity, 0), [cart]);
      const deliveryFee = subtotal > 0 ? (subtotal >= 35 ? 0 : 3.50) : 0;
      const totalAmount = subtotal + deliveryFee;
      const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      // Order Placement
      const handleCheckoutSubmit = (e) => {
        e.preventDefault();
        if (!checkoutForm.name || !checkoutForm.phone || !checkoutForm.address) {
          return triggerToast('Please fill out all required fields!', 'error');
        }
        if (cart.length === 0) return triggerToast('Your cart is empty!', 'error');

        const newOrder = {
          id: `MB-${Math.floor(1000 + Math.random() * 9000)}`,
          date: new Date().toLocaleString(),
          customer: { ...checkoutForm },
          items: [...cart],
          total: totalAmount,
          status: 'New'
        };

        setOrders(prev => [newOrder, ...prev]);
        setConfirmedOrder(newOrder);
        setCart([]);
        setIsCheckoutOpen(false);
        setIsCartOpen(false);
        setCheckoutForm({ name: '', phone: '', address: '', paymentMethod: 'Cash on Delivery', notes: '' });
        triggerToast('Order placed successfully! 🍞');
      };

      // Admin Logic
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPass === 'admin123') {
          setIsAdminLoggedIn(true);
          setShowAdminLoginModal(false);
          setShowAdminView(true);
          setAdminPass('');
          triggerToast('Welcome back, Admin!');
        } else {
          triggerToast('Incorrect password! (Try: admin123)', 'error');
        }
      };

      const handleAddMenuItem = (e) => {
        e.preventDefault();
        if (!newItemForm.name || !newItemForm.price) return triggerToast('Enter item name and price', 'error');
        const item = {
          id: Date.now().toString(),
          name: newItemForm.name,
          category: newItemForm.category,
          price: parseFloat(newItemForm.price),
          description: newItemForm.description || 'Handcrafted fresh home bakery specialty.',
          image: newItemForm.image || 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop&q=80',
          isAvailable: true
        };
        setMenu(prev => [item, ...prev]);
        setNewItemForm({ name: '', category: 'Cakes', price: '', description: '', image: '' });
        triggerToast('New item added to menu!');
      };

      const toggleAvailability = (id) => {
        setMenu(prev => prev.map(i => i.id === id ? { ...i, isAvailable: !i.isAvailable } : i));
        triggerToast('Item availability updated');
      };

      const deleteMenuItem = (id) => {
        setMenu(prev => prev.filter(i => i.id !== id));
        triggerToast('Item removed from menu', 'error');
      };

      const updateOrderStatus = (orderId, newStatus) => {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        triggerToast(`Order status updated to ${newStatus}`);
      };

      const categories = ['All', 'Cakes', 'Breads', 'Cookies', 'Cupcakes', 'Pastries'];
      const filteredMenu = selectedCategory === 'All' ? menu : menu.filter(i => i.category === selectedCategory);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* TOAST SYSTEM */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className={`px-4 py-3 rounded-2xl shadow-xl text-sm font-semibold text-white transition-all transform translate-y-0 ${t.type === 'error' ? 'bg-berry-600' : 'bg-cocoa-800'}`}>
                {t.msg}
              </div>
            ))}
          </div>

          {/* TOP BANNER */}
          <div className="bg-berry-700 text-cream-50 text-xs sm:text-sm py-2 px-4 text-center font-medium">
            🍓 Fresh Batches Every Morning • Free Delivery on Orders Over $35!
          </div>

          {/* NAVBAR */}
          <header className="sticky top-0 z-30 bg-cream-50/90 backdrop-blur-md border-b border-cream-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <a href="#" className="flex items-center gap-3">
                <span className="text-3xl bg-honey-500/10 p-2 rounded-2xl border border-honey-500/20">🧁</span>
                <div>
                  <span className="font-serif text-2xl font-bold tracking-tight text-cocoa-900 block leading-none">Mom's Bakery</span>
                  <span className="text-[10px] text-honey-600 font-bold uppercase tracking-widest">Home Baked Daily</span>
                </div>
              </a>

              <nav className="hidden md:flex items-center gap-8 font-medium text-cocoa-700 text-sm">
                <a href="#story" className="hover:text-honey-600 transition">Our Story</a>
                <a href="#menu" className="hover:text-honey-600 transition">Bakery Menu</a>
                <a href="#contact" className="hover:text-honey-600 transition">Hours & Location</a>
                
                {isAdminLoggedIn ? (
                  <button 
                    onClick={() => setShowAdminView(!showAdminView)} 
                    className="bg-berry-600 text-white px-3 py-1.5 rounded-full text-xs font-bold"
                  >
                    {showAdminView ? 'View Storefront' : 'Admin Panel'}
                  </button>
                ) : (
                  <button 
                    onClick={() => setShowAdminLoginModal(true)} 
                    className="text-xs text-cocoa-500 hover:text-cocoa-900 font-medium underline"
                  >
                    Admin
                  </button>
                )}
              </nav>

              <button 
                onClick={() => setIsCartOpen(true)}
                className="bg-honey-500 hover:bg-honey-600 text-white px-5 py-2.5 rounded-full font-bold shadow-md hover:shadow-lg transition flex items-center gap-2"
              >
                <span>🛒 Basket</span>
                <span className="bg-white text-cocoa-900 text-xs font-extrabold px-2 py-0.5 rounded-full">
                  {totalItemsCount}
                </span>
              </button>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-grow">
            
            {/* ADMIN VIEW MODE */}
            {showAdminView && isAdminLoggedIn ? (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                <div className="bg-white rounded-3xl p-6 sm:p-8 border border-cream-200 shadow-xl">
                  
                  <div className="flex flex-wrap items-center justify-between gap-4 mb-8 pb-4 border-b border-cream-200">
                    <div>
                      <h2 className="font-serif text-3xl font-bold text-cocoa-900">Admin Control Panel</h2>
                      <p className="text-xs text-cocoa-500 mt-1">Manage orders, update menu prices, and toggle sold-out availability live.</p>
                    </div>
                    <div className="flex gap-2">
                      <button 
                        onClick={() => setAdminTab('orders')} 
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'orders' ? 'bg-cocoa-900 text-white' : 'bg-cream-100 text-cocoa-700'}`}
                      >
                        Orders ({orders.length})
                      </button>
                      <button 
                        onClick={() => setAdminTab('menu')} 
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${adminTab === 'menu' ? 'bg-cocoa-900 text-white' : 'bg-cream-100 text-cocoa-700'}`}
                      >
                        Manage Items ({menu.length})
                      </button>
                      <button 
                        onClick={() => { setIsAdminLoggedIn(false); setShowAdminView(false); }} 
                        className="bg-berry-100 text-berry-700 px-3 py-2 rounded-xl text-xs font-bold"
                      >
                        Log Out
                      </button>
                    </div>
                  </div>

                  {adminTab === 'orders' ? (
                    <div className="space-y-4">
                      {orders.length === 0 ? <p className="text-center text-cocoa-500 py-8">No orders placed yet.</p> : (
                        orders.map(order => (
                          <div key={order.id} className="border border-cream-200 rounded-2xl p-5 bg-cream-50/50 flex flex-col md:flex-row justify-between gap-4">
                            <div className="space-y-1">
                              <div className="flex items-center gap-3">
                                <span className="font-bold text-cocoa-900">{order.id}</span>
                                <span className="text-xs text-cocoa-500">{order.date}</span>
                              </div>
                              <div className="text-sm font-semibold text-cocoa-800">👤 {order.customer.name} ({order.customer.phone})</div>
                              <div className="text-xs text-cocoa-600">📍 {order.customer.address}</div>
                              {order.customer.notes && <div className="text-xs italic text-honey-600">"{order.customer.notes}"</div>}
                              
                              <div className="pt-2 text-xs">
                                <strong>Items:</strong> {order.items.map(i => `${i.quantity}x ${i.name}`).join(', ')}
                              </div>
                            </div>

                            <div className="flex md:flex-col justify-between items-end gap-2">
                              <div className="text-right">
                                <span className="text-xs text-cocoa-500 block">Total Paid/Due</span>
                                <span className="font-serif font-bold text-lg text-honey-600">${order.total.toFixed(2)}</span>
                                <span className="text-[10px] block bg-cream-200 px-2 py-0.5 rounded mt-0.5 font-bold">{order.customer.paymentMethod}</span>
                              </div>
                              
                              <div>
                                <label className="text-[10px] font-bold uppercase text-cocoa-500 block mb-1">Update Status</label>
                                <select 
                                  value={order.status}
                                  onChange={(e) => updateOrderStatus(order.id, e.target.value)}
                                  className="text-xs font-bold border border-cream-300 rounded-lg px-2 py-1 bg-white"
                                >
                                  <option value="New">🟡 New Order</option>
                                  <option value="Confirmed">🔵 Confirmed</option>
                                  <option value="Preparing">🟠 Baking</option>
                                  <option value="Out for Delivery">🚚 Out for Delivery</option>
                                  <option value="Delivered">🟢 Delivered</option>
                                </select>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  ) : (
                    <div>
                      {/* ADD ITEM FORM */}
                      <form onSubmit={handleAddMenuItem} className="bg-cream-100 p-5 rounded-2xl mb-8 space-y-4">
                        <h3 className="font-bold text-cocoa-900">Add New Menu Item</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <input 
                            type="text" placeholder="Item Name *" 
                            value={newItemForm.name} onChange={e => setNewItemForm({ ...newItemForm, name: e.target.value })}
                            className="p-2 text-xs rounded-xl border border-cream-300" required 
                          />
                          <select 
                            value={newItemForm.category} onChange={e => setNewItemForm({ ...newItemForm, category: e.target.value })}
                            className="p-2 text-xs rounded-xl border border-cream-300 bg-white"
                          >
                            {categories.filter(c => c !== 'All').map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                          <input 
                            type="number" step="0.50" placeholder="Price ($) *" 
                            value={newItemForm.price} onChange={e => setNewItemForm({ ...newItemForm, price: e.target.value })}
                            className="p-2 text-xs rounded-xl border border-cream-300" required 
                          />
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <input 
                            type="text" placeholder="Description" 
                            value={newItemForm.description} onChange={e => setNewItemForm({ ...newItemForm, description: e.target.value })}
                            className="p-2 text-xs rounded-xl border border-cream-300" 
                          />
                          <input 
                            type="url" placeholder="Image URL" 
                            value={newItemForm.image} onChange={e => setNewItemForm({ ...newItemForm, image: e.target.value })}
                            className="p-2 text-xs rounded-xl border border-cream-300" 
                          />
                        </div>
                        <button type="submit" className="bg-honey-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl hover:bg-honey-600">
                          Add Item to Live Menu
                        </button>
                      </form>

                      {/* ITEM LIST */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {menu.map(item => (
                          <div key={item.id} className="p-3 rounded-2xl border border-cream-200 flex gap-3 items-center bg-cream-50">
                            <img src={item.image} alt={item.name} className="w-16 h-16 rounded-xl object-cover" />
                            <div className="flex-grow">
                              <div className="flex justify-between items-start">
                                <h4 className="font-bold text-xs text-cocoa-900">{item.name}</h4>
                                <span className="font-bold text-xs text-honey-600">${item.price.toFixed(2)}</span>
                              </div>
                              <span className="text-[10px] text-cocoa-500 block">{item.category}</span>
                              <div className="flex gap-2 mt-2">
                                <button 
                                  onClick={() => toggleAvailability(item.id)} 
                                  className={`text-[10px] font-bold px-2 py-0.5 rounded ${item.isAvailable ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}
                                >
                                  {item.isAvailable ? 'In Stock' : 'Sold Out'}
                                </button>
                                <button 
                                  onClick={() => deleteMenuItem(item.id)} 
                                  className="text-[10px] font-bold text-berry-600 hover:underline"
                                >
                                  Delete
                                </button>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              </section>
            ) : (
              /* PUBLIC STOREFRONT */
              <>
                {/* HERO SECTION */}
                <section className="relative py-16 lg:py-24 bg-gradient-to-b from-cream-100 to-cream-50 overflow-hidden">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                    <div className="lg:col-span-7 space-y-6 text-center lg:text-left">
                      <span className="inline-block bg-honey-500/10 text-honey-600 font-bold text-xs px-3.5 py-1.5 rounded-full border border-honey-500/20">
                        ✨ Made Fresh Daily with Organic Ingredients
                      </span>
                      <h1 className="font-serif text-4xl sm:text-6xl font-bold text-cocoa-900 leading-tight">
                        Warm, Handcrafted Bakery Goodness
                      </h1>
                      <p className="text-cocoa-700 text-base sm:text-lg max-w-xl mx-auto lg:mx-0">
                        Welcome to Mom's Bakery. From our 36-hour fermented sourdoughs to our melt-in-your-mouth chocolate cakes, every bake is crafted with traditional recipes and love.
                      </p>
                      <div className="flex flex-wrap justify-center lg:justify-start gap-4 pt-2">
                        <a href="#menu" className="bg-honey-500 hover:bg-honey-600 text-white font-bold px-8 py-4 rounded-full shadow-lg transition">
                          Browse Bakery Menu
                        </a>
                        <a href="#story" className="bg-white text-cocoa-800 font-bold px-6 py-4 rounded-full border border-cream-200 transition hover:bg-cream-100">
                          Our Story
                        </a>
                      </div>
                    </div>

                    <div className="lg:col-span-5 relative">
                      <div className="aspect-square rounded-3xl overflow-hidden shadow-2xl border-8 border-white transform rotate-2 hover:rotate-0 transition duration-500">
                        <img src="https://images.unsplash.com/photo-1517433670267-08bbd4be890f?w=800&auto=format&fit=crop&q=80" alt="Fresh bakes" className="w-full h-full object-cover" />
                      </div>
                    </div>
                  </div>
                </section>

                {/* STORY SECTION */}
                <section id="story" className="py-16 bg-cream-100 border-y border-cream-200">
                  <div className="max-w-4xl mx-auto px-4 text-center space-y-4">
                    <span className="text-xs font-extrabold text-honey-600 tracking-widest uppercase">Family Tradition</span>
                    <h2 className="font-serif text-3xl font-bold text-cocoa-900">"Baked exactly the way Mom used to make it."</h2>
                    <p className="text-cocoa-700 leading-relaxed text-sm sm:text-base">
                      Mom's Bakery began in a cozy home kitchen with a simple sourdough starter and a passion for pure ingredients. We never use artificial flavors or premixes — only real butter, fresh eggs, and patience.
                    </p>
                  </div>
                </section>

                {/* MENU / ORDERING SECTION */}
                <section id="menu" className="py-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="text-center max-w-2xl mx-auto mb-10">
                    <span className="text-xs font-bold text-honey-600 uppercase tracking-widest">Our Fresh Selection</span>
                    <h2 className="font-serif text-3xl sm:text-4xl font-bold text-cocoa-900 mt-1">Order Online</h2>
                  </div>

                  {/* CATEGORY TABS */}
                  <div className="flex justify-center flex-wrap gap-2 mb-10">
                    {categories.map(cat => (
                      <button 
                        key={cat} 
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-5 py-2 rounded-full text-xs font-bold transition ${selectedCategory === cat ? 'bg-cocoa-900 text-white shadow-md' : 'bg-cream-100 text-cocoa-700 hover:bg-cream-200'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* MENU CARDS */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {filteredMenu.map(item => {
                      const qty = getItemQty(item.id);
                      return (
                        <div key={item.id} className="bg-white rounded-3xl overflow-hidden border border-cream-200 shadow-sm hover:shadow-xl transition flex flex-col justify-between group">
                          <div>
                            <div className="relative h-48 overflow-hidden">
                              <img src={item.image} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                              {!item.isAvailable && (
                                <div className="absolute inset-0 bg-cocoa-900/70 backdrop-blur-sm flex items-center justify-center text-white font-bold text-sm">
                                  Sold Out
                                </div>
                              )}
                              <span className="absolute top-3 right-3 bg-white/90 backdrop-blur text-cocoa-900 text-xs font-bold px-2.5 py-1 rounded-full border border-cream-200">
                                ${item.price.toFixed(2)}
                              </span>
                            </div>
                            <div className="p-5">
                              <span className="text-[10px] font-bold text-honey-600 uppercase tracking-widest">{item.category}</span>
                              <h3 className="font-serif font-bold text-cocoa-900 text-lg mt-0.5">{item.name}</h3>
                              <p className="text-xs text-cocoa-600 mt-2 line-clamp-2 leading-relaxed">{item.description}</p>
                            </div>
                          </div>

                          <div className="p-5 pt-0">
                            {qty > 0 ? (
                              <div className="flex items-center justify-between bg-cream-100 p-1.5 rounded-2xl border border-cream-200">
                                <button onClick={() => updateQty(item.id, -1)} className="w-8 h-8 rounded-xl bg-white text-cocoa-900 font-bold hover:bg-cream-200 flex items-center justify-center">-</button>
                                <span className="font-bold text-sm text-cocoa-900">{qty} in basket</span>
                                <button onClick={() => updateQty(item.id, 1)} className="w-8 h-8 rounded-xl bg-white text-cocoa-900 font-bold hover:bg-cream-200 flex items-center justify-center">+</button>
                              </div>
                            ) : (
                              <button 
                                onClick={() => addToCart(item)}
                                disabled={!item.isAvailable}
                                className={`w-full py-3 rounded-2xl font-bold text-xs transition shadow-sm ${item.isAvailable ? 'bg-cocoa-900 hover:bg-cocoa-800 text-white' : 'bg-cream-200 text-cocoa-500 cursor-not-allowed'}`}
                              >
                                {item.isAvailable ? 'Add to Order' : 'Unavailable'}
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* ADDRESS & CONTACT SECTION */}
                <section id="contact" className="py-16 bg-cream-100 border-t border-cream-200">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                      <div className="bg-white p-6 rounded-3xl border border-cream-200 shadow-sm">
                        <span className="text-2xl mb-2 block">📍</span>
                        <h4 className="font-serif font-bold text-cocoa-900 text-lg">Visit Bakery</h4>
                        <p className="text-xs text-cocoa-600 mt-2 leading-relaxed">
                          124 Maplewood Bakery Lane<br />Suite 4B, Sweet Town, ST 90210
                        </p>
                      </div>

                      <div className="bg-white p-6 rounded-3xl border border-cream-200 shadow-sm">
                        <span className="text-2xl mb-2 block">⏰</span>
                        <h4 className="font-serif font-bold text-cocoa-900 text-lg">Working Hours</h4>
                        <p className="text-xs text-cocoa-600 mt-2 leading-relaxed">
                          Mon - Sat: 7:00 AM - 7:00 PM<br />
                          Sunday: 8:00 AM - 3:00 PM
                        </p>
                      </div>

                      <div className="bg-white p-6 rounded-3xl border border-cream-200 shadow-sm">
                        <span className="text-2xl mb-2 block">🚚</span>
                        <h4 className="font-serif font-bold text-cocoa-900 text-lg">Delivery Area</h4>
                        <p className="text-xs text-cocoa-600 mt-2 leading-relaxed">
                          We deliver warm within a 12-mile radius.<br />
                          Call us: <strong>+1 (555) MOM-BAKE</strong>
                        </p>
                      </div>
                    </div>
                  </div>
                </section>
              </>
            )}

          </main>

          {/* CART SLIDE-OVER DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-cocoa-900/50 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white h-full flex flex-col justify-between shadow-2xl p-6 overflow-y-auto">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b border-cream-200">
                    <h3 className="font-serif font-bold text-xl text-cocoa-900">Your Fresh Basket</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-cocoa-500 font-bold hover:text-cocoa-900 text-lg">✕</button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-16 space-y-3">
                      <span className="text-4xl">🧺</span>
                      <p className="text-sm font-semibold text-cocoa-600">Your basket is currently empty</p>
                    </div>
                  ) : (
                    <div className="divide-y divide-cream-100 my-4">
                      {cart.map(item => (
                        <div key={item.id} className="py-3 flex justify-between items-center">
                          <div>
                            <h4 className="font-bold text-sm text-cocoa-900">{item.name}</h4>
                            <span className="text-xs text-honey-600 font-bold">${item.price.toFixed(2)} each</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQty(item.id, -1)} className="w-7 h-7 rounded-lg bg-cream-100 text-cocoa-900 font-bold">-</button>
                            <span className="text-xs font-bold">{item.quantity}</span>
                            <button onClick={() => updateQty(item.id, 1)} className="w-7 h-7 rounded-lg bg-cream-100 text-cocoa-900 font-bold">+</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t border-cream-200 pt-4 space-y-3">
                    <div className="space-y-1 text-xs">
                      <div className="flex justify-between text-cocoa-600">
                        <span>Subtotal</span>
                        <span>${subtotal.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between text-cocoa-600">
                        <span>Delivery Fee {subtotal >= 35 && '(Free over $35!)'}</span>
                        <span>${deliveryFee.toFixed(2)}</span>
                      </div>
                      <div className="flex justify-between font-bold text-base text-cocoa-900 pt-2 border-t">
                        <span>Total</span>
                        <span>${totalAmount.toFixed(2)}</span>
                      </div>
                    </div>

                    <button 
                      onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                      className="w-full bg-honey-500 hover:bg-honey-600 text-white font-bold py-3.5 rounded-2xl transition shadow-md"
                    >
                      Proceed to Checkout
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-cocoa-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-cream-200">
                <div className="flex justify-between items-center pb-3 border-b border-cream-200">
                  <h3 className="font-serif font-bold text-xl text-cocoa-900">Delivery Details</h3>
                  <button onClick={() => setIsCheckoutOpen(false)} className="text-cocoa-500 font-bold">✕</button>
                </div>

                <form onSubmit={handleCheckoutSubmit} className="space-y-4 mt-4">
                  <div>
                    <label className="text-xs font-bold text-cocoa-700 block mb-1">Full Name *</label>
                    <input 
                      type="text" required placeholder="e.g. Jane Doe"
                      value={checkoutForm.name} onChange={e => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                      className="w-full p-2.5 text-xs rounded-xl border border-cream-300 focus:outline-none focus:ring-2 focus:ring-honey-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-cocoa-700 block mb-1">Phone Number *</label>
                    <input 
                      type="tel" required placeholder="e.g. +1 (555) 000-0000"
                      value={checkoutForm.phone} onChange={e => setCheckoutForm({ ...checkoutForm, phone: e.target.value })}
                      className="w-full p-2.5 text-xs rounded-xl border border-cream-300 focus:outline-none focus:ring-2 focus:ring-honey-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-cocoa-700 block mb-1">Delivery Address *</label>
                    <textarea 
                      required rows="2" placeholder="Street name, house number, apt..."
                      value={checkoutForm.address} onChange={e => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                      className="w-full p-2.5 text-xs rounded-xl border border-cream-300 focus:outline-none focus:ring-2 focus:ring-honey-500"
                    ></textarea>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-cocoa-700 block mb-1">Payment Method</label>
                    <select 
                      value={checkoutForm.paymentMethod} onChange={e => setCheckoutForm({ ...checkoutForm, paymentMethod: e.target.value })}
                      className="w-full p-2.5 text-xs rounded-xl border border-cream-300 bg-white"
                    >
                      <option value="Cash on Delivery">Cash on Delivery</option>
                      <option value="UPI">UPI / Digital Transfer</option>
                      <option value="Card on Delivery">Card on Delivery</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-cocoa-700 block mb-1">Special Baking / Delivery Notes</label>
                    <input 
                      type="text" placeholder="e.g. Extra candle or gate code..."
                      value={checkoutForm.notes} onChange={e => setCheckoutForm({ ...checkoutForm, notes: e.target.value })}
                      className="w-full p-2.5 text-xs rounded-xl border border-cream-300"
                    />
                  </div>

                  <div className="bg-cream-100 p-3 rounded-xl text-xs font-bold flex justify-between">
                    <span>Total Payable:</span>
                    <span className="text-honey-600">${totalAmount.toFixed(2)}</span>
                  </div>

                  <button type="submit" className="w-full bg-honey-500 hover:bg-honey-600 text-white font-bold py-3.5 rounded-2xl transition">
                    Confirm Order
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* CONFIRMED ORDER RECEIPT MODAL */}
          {confirmedOrder && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-cocoa-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 text-center shadow-2xl space-y-4">
                <span className="text-5xl">🎉</span>
                <h3 className="font-serif font-bold text-2xl text-cocoa-900">Order Placed!</h3>
                <p className="text-xs text-cocoa-600">Thank you! Mom is preheating the oven now.</p>
                
                <div className="bg-cream-50 p-4 rounded-2xl border border-cream-200 text-left text-xs space-y-2">
                  <div className="flex justify-between font-bold text-cocoa-900 border-b pb-2">
                    <span>Order Reference:</span>
                    <span>{confirmedOrder.id}</span>
                  </div>
                  <div><strong>Customer:</strong> {confirmedOrder.customer.name}</div>
                  <div><strong>Address:</strong> {confirmedOrder.customer.address}</div>
                  <div><strong>Payment:</strong> {confirmedOrder.customer.paymentMethod}</div>
                  <div className="pt-2 border-t font-bold text-right text-honey-600 text-sm">
                    Total: ${confirmedOrder.total.toFixed(2)}
                  </div>
                </div>

                <button 
                  onClick={() => setConfirmedOrder(null)} 
                  className="w-full bg-cocoa-900 text-white font-bold py-3 rounded-2xl"
                >
                  Back to Bakery
                </button>
              </div>
            </div>
          )}

          {/* ADMIN AUTH MODAL */}
          {showAdminLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-cocoa-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-xs w-full p-6 shadow-2xl text-center space-y-4">
                <span className="text-3xl">🔐</span>
                <h3 className="font-serif font-bold text-xl text-cocoa-900">Admin Login</h3>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input 
                    type="password" placeholder="Password (admin123)" 
                    value={adminPass} onChange={e => setAdminPass(e.target.value)}
                    className="w-full p-2.5 text-xs text-center rounded-xl border border-cream-300 focus:outline-none focus:ring-2 focus:ring-honey-500"
                  />
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowAdminLoginModal(false)} className="w-1/2 bg-cream-100 font-bold text-xs py-2 rounded-xl">
                      Cancel
                    </button>
                    <button type="submit" className="w-1/2 bg-cocoa-900 text-white font-bold text-xs py-2 rounded-xl">
                      Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-cocoa-900 text-cream-200 py-10 border-t border-cocoa-800 text-xs text-center">
            <div className="max-w-7xl mx-auto px-4 space-y-3">
              <div className="font-serif text-lg font-bold text-white">Mom's Bakery</div>
              <p className="text-cream-300 max-w-sm mx-auto">Made fresh every day with organic ingredients and traditional home recipes.</p>
              <div className="text-cream-300 pt-4">© {new Date().getFullYear()} Mom's Bakery. All rights reserved.</div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
