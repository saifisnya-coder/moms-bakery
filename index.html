<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mom's Bakery — Freshly Baked Home Goodness</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: {
                50: '#FFFDF9',
                100: '#FAF4E8',
                200: '#F3E8D3',
                300: '#EBD8B8',
              },
              cocoa: {
                500: '#8C5B3E',
                700: '#5A3622',
                800: '#3D2314',
                900: '#26140A',
              },
              honey: {
                400: '#F59E0B',
                500: '#D97706',
                600: '#B45309',
              },
              berry: {
                500: '#E11D48',
                600: '#BE123C',
                700: '#9F1239',
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'Georgia', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            boxShadow: {
              'warm': '0 10px 30px -5px rgba(61, 35, 20, 0.08)',
              'warm-hover': '0 20px 40px -10px rgba(61, 35, 20, 0.15)',
            }
          }
        }
      }
    </script>

    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone for JSX processing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        background-color: #FFFDF9;
        color: #3D2314;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FAF4E8;
      }
      ::-webkit-scrollbar-thumb {
        background: #D97706;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B45309;
      }
    </style>
</head>
<body class="antialiased selection:bg-honey-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      // Initial Default Bakery Items
      const INITIAL_MENU = [
        {
          id: '1',
          name: 'Classic Chocolate Fudge Cake',
          category: 'Cakes',
          price: 28.00,
          description: 'Rich three-layer Belgian dark chocolate sponge with silky chocolate ganache frosting.',
          image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '2',
          name: 'Classic Red Velvet Cake',
          category: 'Cakes',
          price: 32.00,
          description: 'Moist crimson sponge infused with cocoa, layered with signature cream cheese frosting.',
          image: 'https://images.unsplash.com/photo-1586788680434-30d324b2d46f?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '3',
          name: 'Artisanal Country Sourdough',
          category: 'Breads',
          price: 8.50,
          description: 'Naturally fermented for 36 hours. Crispy blistered crust with a soft, open airy crumb.',
          image: 'https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '4',
          name: 'Golden Butter Brioche Buns',
          category: 'Breads',
          price: 6.00,
          description: 'Pack of 4 super soft, pillowy buns rich with French butter and organic egg glaze.',
          image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '5',
          name: 'Warm Chunk Chocolate Chip Cookies',
          category: 'Cookies',
          price: 12.00,
          description: 'Half-dozen giant cookies, crispy edges with soft gooey melted chocolate centers.',
          image: 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '6',
          name: 'Assorted French Macarons Box',
          category: 'Cookies',
          price: 18.00,
          description: 'Box of 6 delicate almond shells with pistachio, salted caramel, and raspberry ganache.',
          image: 'https://images.unsplash.com/photo-1569864358642-9d1684040f43?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '7',
          name: 'Madagascar Vanilla Bean Cupcakes',
          category: 'Cupcakes',
          price: 14.00,
          description: 'Pack of 4 fluffy vanilla bean cupcakes topped with whipped buttercream and sprinkles.',
          image: 'https://images.unsplash.com/photo-1576618148400-f54bed99fcfd?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        },
        {
          id: '8',
          name: 'Butter Flake Butter Croissants',
          category: 'Pastries',
          price: 10.00,
          description: 'Pack of 3 flaky, golden-brown croissants freshly baked every morning at 6 AM.',
          image: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&q=80&w=800',
          isAvailable: true
        }
      ];

      // Initial Sample Orders
      const INITIAL_ORDERS = [
        {
          id: 'MB-101',
          date: '2025-05-10 10:30 AM',
          customer: {
            name: 'Sarah Jenkins',
            phone: '+1 (555) 234-5678',
            address: '742 Evergreen Terrace, Maplewood',
            paymentMethod: 'UPI',
            notes: 'Please leave at front porch'
          },
          items: [
            { id: '1', name: 'Classic Chocolate Fudge Cake', price: 28.00, quantity: 1 },
            { id: '5', name: 'Warm Chunk Chocolate Chip Cookies', price: 12.00, quantity: 1 }
          ],
          total: 40.00,
          status: 'Delivered'
        }
      ];

      // Inline SVG Icons Component Helper
      const Icon = ({ name, className = "w-5 h-5" }) => {
        const icons = {
          bag: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />,
          plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />,
          minus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" />,
          trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
          close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />,
          star: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />,
          phone: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />,
          mapPin: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0zM15 11a3 3 0 11-6 0 3 3 0 016 0z" />,
          clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
          truck: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1m-6 0a1 1 0 01-1-1m11 1a1 1 0 01-1-1" />,
          lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />,
          user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
          check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />,
          sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
          heart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        };

        return (
          <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
            {icons[name] || null}
          </svg>
        );
      };

      // Main Bakery Application
      function App() {
        // Persistent State via LocalStorage
        const [menu, setMenu] = useState(() => {
          const saved = localStorage.getItem('moms_bakery_menu');
          return saved ? JSON.parse(saved) : INITIAL_MENU;
        });

        const [cart, setCart] = useState(() => {
          const saved = localStorage.getItem('moms_bakery_cart');
          return saved ? JSON.parse(saved) : [];
        });

        const [orders, setOrders] = useState(() => {
          const saved = localStorage.getItem('moms_bakery_orders');
          return saved ? JSON.parse(saved) : INITIAL_ORDERS;
        });

        // UI States
        const [activeCategory, setActiveCategory] = useState('All');
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
        const [latestOrder, setLatestOrder] = useState(null);
        
        // Admin States
        const [isAdminMode, setIsAdminMode] = useState(false);
        const [isAdminAuthModalOpen, setIsAdminAuthModalOpen] = useState(false);
        const [adminPasswordInput, setAdminPasswordInput] = useState('');
        const [adminTab, setAdminTab] = useState('orders'); // 'orders' | 'menu'
        
        // Toast Notifications
        const [toasts, setToasts] = useState([]);

        // New Item Form State (Admin)
        const [newItem, setNewItem] = useState({
          name: '',
          category: 'Cakes',
          price: '',
          description: '',
          image: ''
        });

        // Checkout Form State
        const [checkoutForm, setCheckoutForm] = useState({
          name: '',
          phone: '',
          address: '',
          paymentMethod: 'Cash on Delivery',
          notes: ''
        });

        // Save to LocalStorage effects
        useEffect(() => {
          localStorage.setItem('moms_bakery_menu', JSON.stringify(menu));
        }, [menu]);

        useEffect(() => {
          localStorage.setItem('moms_bakery_cart', JSON.stringify(cart));
        }, [cart]);

        useEffect(() => {
          localStorage.setItem('moms_bakery_orders', JSON.stringify(orders));
        }, [orders]);

        // Helper: Add Toast Notification
        const showToast = (message, type = 'success') => {
          const id = Date.now();
          setToasts(prev => [...prev, { id, message, type }]);
          setTimeout(() => {
            setToasts(prev => prev.filter(t => t.id !== id));
          }, 3500);
        };

        // Cart Actions
        const addToCart = (item) => {
          if (!item.isAvailable) {
            showToast(`Sorry, ${item.name} is currently sold out!`, 'error');
            return;
          }
          setCart(prev => {
            const existing = prev.find(i => i.id === item.id);
            if (existing) {
              return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
            }
            return [...prev, { ...item, quantity: 1 }];
          });
          showToast(`Added "${item.name}" to your cart!`);
        };

        const updateCartQty = (id, delta) => {
          setCart(prev => {
            return prev.map(item => {
              if (item.id === id) {
                const newQty = item.quantity + delta;
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            }).filter(Boolean);
          });
        };

        const removeFromCart = (id) => {
          setCart(prev => prev.filter(i => i.id !== id));
          showToast('Item removed from cart');
        };

        // Cart Computations
        const cartCount = useMemo(() => cart.reduce((sum, item) => sum + item.quantity, 0), [cart]);
        const cartSubtotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
        const deliveryFee = cartSubtotal > 0 ? (cartSubtotal > 35 ? 0 : 3.50) : 0;
        const cartTotal = cartSubtotal + deliveryFee;

        // Categories
        const categories = ['All', 'Cakes', 'Breads', 'Cookies', 'Cupcakes', 'Pastries'];

        const filteredMenu = useMemo(() => {
          if (activeCategory === 'All') return menu;
          return menu.filter(item => item.category === activeCategory);
        }, [menu, activeCategory]);

        // Handle Order Submission
        const handlePlaceOrder = (e) => {
          e.preventDefault();
          if (!checkoutForm.name.trim() || !checkoutForm.phone.trim() || !checkoutForm.address.trim()) {
            showToast('Please fill in all required delivery details!', 'error');
            return;
          }

          if (cart.length === 0) {
            showToast('Your cart is empty!', 'error');
            return;
          }

          const newOrder = {
            id: `MB-${Math.floor(1000 + Math.random() * 9000)}`,
            date: new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }),
            customer: { ...checkoutForm },
            items: [...cart],
            total: cartTotal,
            status: 'New'
          };

          setOrders(prev => [newOrder, ...prev]);
          setLatestOrder(newOrder);
          setCart([]);
          setIsCheckoutOpen(false);
          setIsCartOpen(false);
          setCheckoutForm({ name: '', phone: '', address: '', paymentMethod: 'Cash on Delivery', notes: '' });
          showToast('Order placed successfully! Mom is getting to work 🎉');
        };

        // Admin Actions
        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (adminPasswordInput === 'admin123') {
            setIsAdminMode(true);
            setIsAdminAuthModalOpen(false);
            setAdminPasswordInput('');
            showToast('Welcome back, Admin!');
          } else {
            showToast('Incorrect password! (Hint: admin123)', 'error');
          }
        };

        const handleAddMenuItem = (e) => {
          e.preventDefault();
          if (!newItem.name || !newItem.price) {
            showToast('Please provide a name and price for the item', 'error');
            return;
          }

          const itemToAdd = {
            id: Date.now().toString(),
            name: newItem.name,
            category: newItem.category,
            price: parseFloat(newItem.price),
            description: newItem.description || 'Freshly handmade home bakery delight.',
            image: newItem.image || 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=800',
            isAvailable: true
          };

          setMenu(prev => [itemToAdd, ...prev]);
          setNewItem({ name: '', category: 'Cakes', price: '', description: '', image: '' });
          showToast(`Added "${itemToAdd.name}" to live menu!`);
        };

        const toggleItemAvailability = (id) => {
          setMenu(prev => prev.map(item => {
            if (item.id === id) {
              const updated = !item.isAvailable;
              showToast(`"${item.name}" marked as ${updated ? 'Available' : 'Sold Out'}`);
              return { ...item, isAvailable: updated };
            }
            return item;
          }));
        };

        const deleteMenuItem = (id) => {
          const item = menu.find(m => m.id === id);
          setMenu(prev => prev.filter(m => m.id !== id));
          showToast(`Deleted "${item?.name}" from menu`, 'error');
        };

        const updateOrderStatus = (orderId, newStatus) => {
          setOrders(prev => prev.map(order => order.id === orderId ? { ...order, status: newStatus } : order));
          showToast(`Order ${orderId} updated to ${newStatus}`);
        };

        return (
          <div className="min-h-screen flex flex-col justify-between text-cocoa-800">
            
            {/* TOP ANNOUNCEMENT BAR */}
            <div className="bg-berry-700 text-cream-50 text-xs sm:text-sm py-2 px-4 text-center font-medium flex items-center justify-center gap-2 shadow-inner">
              <Icon name="sparkles" className="w-4 h-4 text-honey-400" />
              <span>Fresh Batch Out Every Morning at 8:00 AM • Free Delivery on Orders Over $35!</span>
            </div>

            {/* NAVIGATION HEADER */}
            <header className="sticky top-0 z-30 bg-cream-50/95 backdrop-blur-md border-b border-cream-200 shadow-sm transition-all">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                
                {/* Brand / Logo */}
                <a href="#" className="flex items-center gap-3 group">
                  <div className="w-12 h-12 rounded-full bg-honey-500/10 text-honey-600 flex items-center justify-center text-2xl group-hover:scale-105 transition-transform border border-honey-500/20">
                    🧁
                  </div>
                  <div>
                    <span className="font-serif text-2xl font-bold tracking-tight text-cocoa-900 block leading-none">Mom's Bakery</span>
                    <span className="text-xs text-honey-600 font-medium tracking-widest uppercase mt-0.5 block">Home-Baked with Love</span>
                  </div>
                </a>

                {/* Desktop Nav Links */}
                <nav className="hidden md:flex items-center gap-8 font-medium text-cocoa-700">
                  <a href="#story" className="hover:text-honey-600 transition-colors">Our Story</a>
                  <a href="#menu" className="hover:text-honey-600 transition-colors">Fresh Menu</a>
                  <a href="#contact" className="hover:text-honey-600 transition-colors">Find & Contact Us</a>
                  
                  {isAdminMode ? (
                    <button 
                      onClick={() => { setIsAdminMode(false); showToast('Exited Admin Mode'); }}
                      className="px-3 py-1.5 text-xs font-semibold bg-berry-600 text-white rounded-full hover:bg-berry-700 transition"
                    >
                      Exit Admin Mode
                    </button>
                  ) : (
                    <button 
                      onClick={() => setIsAdminAuthModalOpen(true)}
                      className="text-xs text-cocoa-500 hover:text-cocoa-900 underline underline-offset-4"
                    >
                      Admin Access
                    </button>
                  )}
                </nav>

                {/* Right Actions */}
                <div className="flex items-center gap-3">
                  {/* Floating Cart Button */}
                  <button 
                    onClick={() => setIsCartOpen(true)}
                    className="relative bg-honey-500 hover:bg-honey-600 text-white px-4 py-2.5 rounded-full font-medium shadow-md hover:shadow-lg transition-all flex items-center gap-2 group transform active:scale-95"
                  >
                    <Icon name="bag" className="w-5 h-5 group-hover:rotate-12 transition-transform" />
                    <span className="hidden sm:inline">My Basket</span>
                    {cartCount > 0 && (
                      <span className="bg-berry-600 text-white text-xs font-bold rounded-full h-5 min-w-[20px] px-1 flex items-center justify-center border-2 border-honey-500">
                        {cartCount}
                      </span>
                    )}
                  </button>
                </div>
              </div>
            </header>

            {/* ADMIN BANNER (If logged in) */}
            {isAdminMode && (
              <div className="bg-cocoa-900 text-cream-100 py-3 px-4 shadow-lg sticky top-20 z-20 border-b border-honey-500/40">
                <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4 text-sm">
                  <div className="flex items-center gap-2">
                    <span className="bg-honey-500 text-cocoa-900 font-bold px-2 py-0.5 rounded text-xs uppercase tracking-wider">Admin Portal Active</span>
                    <span>Direct control over menu availability and customer order statuses.</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setAdminTab('orders')} 
                      className={`px-3 py-1 rounded-md text-xs font-semibold transition ${adminTab === 'orders' ? 'bg-honey-500 text-cocoa-900' : 'bg-cocoa-800 text-cream-200 hover:bg-cocoa-700'}`}
                    >
                      Manage Orders ({orders.length})
                    </button>
                    <button 
                      onClick={() => setAdminTab('menu')} 
                      className={`px-3 py-1 rounded-md text-xs font-semibold transition ${adminTab === 'menu' ? 'bg-honey-500 text-cocoa-900' : 'bg-cocoa-800 text-cream-200 hover:bg-cocoa-700'}`}
                    >
                      Manage Menu ({menu.length})
                    </button>
                  </div>
                </div>
              </div>
            )}

            <main className="flex-grow">
              
              {/* ADMIN DASHBOARD VIEW (When active) */}
              {isAdminMode ? (
                <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                  <div className="bg-white rounded-3xl p-6 md:p-8 border border-cream-200 shadow-warm">
                    
                    {adminTab === 'orders' ? (
                      <div>
                        <div className="flex items-center justify-between mb-6 pb-4 border-b border-cream-200">
                          <div>
                            <h2 className="font-serif text-2xl font-bold text-cocoa-900">Customer Orders Dashboard</h2>
                            <p className="text-sm text-cocoa-500">Track and update active home delivery orders in real time.</p>
                          </div>
                        </div>

                        {orders.length === 0 ? (
                          <div className="text-center py-12 text-cocoa-500">No orders placed yet.</div>
                        ) : (
                          <div className="space-y-4">
                            {orders.map(order => (
                              <div key={order.id} className="border border-cream-200 rounded-2xl p-5 bg-cream-50/50 hover:bg-cream-50 transition">
                                <div className="flex flex-wrap items-start justify-between gap-4 mb-4 pb-3 border-b border-cream-200">
                                  <div>
                                    <div className="flex items-center gap-3">
                                      <span className="font-bold text-cocoa-900 text-lg">{order.id}</span>
                                      <span className="text-xs text-cocoa-500">{order.date}</span>
                                    </div>
                                    <div className="text-sm font-medium text-cocoa-800 mt-1">
                                      👤 {order.customer.name} • 📞 {order.customer.phone}
                                    </div>
