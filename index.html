<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomsBakery | Admin & WhatsApp Integrated</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FDF8F5; scroll-behavior: smooth; overflow-x: hidden;}
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        [x-cloak] { display: none !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .admin-input { border: 1px solid #ddd; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; font-size: 14px;}
        .category-btn { transition: all 0.3s ease; white-space: nowrap; }
    </style>
</head>
<body x-data="bakeryApp()" x-init="init()">

    <!-- 1. NAVIGATION -->
    <nav class="fixed w-full z-50 glass py-3 px-6 flex justify-between items-center shadow-sm">
        <div class="serif text-2xl font-bold text-[#3E2723]" x-text="site.brandName">MomsBakery</div>
        <div class="flex items-center gap-4">
            <button @click="showAdminLogin = true" class="text-[10px] font-bold border border-[#3E2723] px-3 py-1 rounded-full uppercase">Admin</button>
            <div class="relative cursor-pointer" @click="showCart = true">
                <span class="text-2xl">🛒</span>
                <span class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center" x-text="cartCount()"></span>
            </div>
        </div>
    </nav>

    <!-- 2. HERO SECTION -->
    <section class="h-[60vh] flex items-center justify-center text-center bg-[#FFF5F5] px-6 pt-16">
        <div class="animate__animated animate__fadeIn">
            <span class="text-pink-500 font-bold tracking-[0.4em] text-[10px] uppercase block mb-2" x-text="site.heroTag"></span>
            <h1 class="serif text-5xl md:text-7xl text-[#3E2723] mb-4" x-text="site.heroTitle"></h1>
            <p class="text-gray-500 text-sm mb-8" x-text="site.heroSub"></p>
            <a href="#shop" class="bg-[#3E2723] text-white px-8 py-3 rounded-full font-bold text-sm shadow-xl">Browse Menu</a>
        </div>
    </section>

    <!-- 3. SHOP BY WEIGHT SECTION -->
    <section class="py-8 bg-white border-b">
        <div class="max-w-7xl mx-auto px-6">
            <h3 class="text-center text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Shop Cakes by Weight</h3>
            <div class="flex overflow-x-auto gap-3 no-scrollbar justify-start md:justify-center">
                <template x-for="w in weightOptions">
                    <button @click="activeWeight = w" 
                            :class="activeWeight === w ? 'bg-pink-500 text-white' : 'bg-gray-100 text-gray-500'"
                            class="px-5 py-2 rounded-xl text-xs font-bold category-btn" x-text="w"></button>
                </template>
            </div>
        </div>
    </section>

    <!-- 4. CATEGORY TABS (Cakes, Drinks, etc.) -->
    <section id="shop" class="py-10 px-6 max-w-7xl mx-auto">
        <div class="flex overflow-x-auto gap-3 no-scrollbar justify-start md:justify-center mb-10">
            <template x-for="cat in categories">
                <button @click="activeTab = cat" 
                        :class="activeTab === cat ? 'bg-[#3E2723] text-white shadow-lg' : 'bg-white text-gray-400'"
                        class="px-6 py-2 rounded-full text-xs font-bold border border-gray-100 category-btn"
                        x-text="cat"></button>
            </template>
        </div>

        <!-- PRODUCT GRID -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <template x-for="item in filteredItems" :key="item.id">
                <div class="bg-white p-4 rounded-[30px] shadow-sm hover:shadow-md transition-all relative group animate__animated animate__fadeInUp">
                    <template x-if="item.isOutOfStock">
                        <div class="absolute inset-0 z-10 bg-white/70 backdrop-blur-[1px] flex items-center justify-center rounded-[30px]">
                            <span class="bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-full">SOLD OUT</span>
                        </div>
                    </template>
                    <img :src="item.image" class="w-full aspect-square object-cover rounded-[20px] mb-3 group-hover:scale-105 transition">
                    <h3 class="font-bold text-sm text-[#3E2723] truncate" x-text="item.name"></h3>
                    <div class="flex justify-between items-center mt-1 mb-3">
                        <span class="text-pink-600 font-bold text-sm">₹<span x-text="item.price"></span></span>
                        <span class="text-[9px] text-gray-400 font-bold" x-text="item.weight"></span>
                    </div>
                    <button @click="addToCart(item)" :disabled="item.isOutOfStock" class="w-full bg-[#3E2723] text-white py-2 rounded-xl text-[10px] font-bold uppercase">Add to Cart</button>
                </div>
            </template>
        </div>
    </section>

    <!-- 5. SHOPPING CART SIDEBAR -->
    <div x-show="showCart" class="fixed inset-0 z-[100] flex justify-end" x-cloak>
        <div class="absolute inset-0 bg-black/60" @click="showCart = false"></div>
        <div class="relative w-full max-w-md bg-white h-full p-8 shadow-2xl flex flex-col animate__animated animate__slideInRight">
            <div class="flex justify-between items-center mb-8">
                <h2 class="serif text-3xl">Your Order</h2>
                <button @click="showCart = false" class="bg-gray-100 w-10 h-10 rounded-full font-bold text-xl">&times;</button>
            </div>
            
            <div class="flex-1 overflow-y-auto no-scrollbar">
                <template x-for="(item, index) in cart" :key="index">
                    <div class="flex gap-4 mb-4 bg-gray-50 p-4 rounded-3xl">
                        <img :src="item.image" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm" x-text="item.name"></h4>
                            <p class="text-xs text-gray-400">₹<span x-text="item.price"></span> | <span x-text="item.weight"></span></p>
                            <div class="flex items-center gap-3 mt-2">
                                <button @click="updateQty(index, -1)" class="w-6 h-6 bg-white rounded-full shadow text-xs">-</button>
                                <span class="text-xs font-bold" x-text="item.qty"></span>
                                <button @click="updateQty(index, 1)" class="w-6 h-6 bg-white rounded-full shadow text-xs">+</button>
                            </div>
                        </div>
                        <button @click="cart.splice(index, 1)" class="text-red-400">🗑️</button>
                    </div>
                </template>
            </div>

            <div class="mt-6 border-t pt-6">
                <div class="flex justify-between font-bold text-xl mb-6">
                    <span>Total Bill:</span>
                    <span>₹<span x-text="getCartTotal()"></span></span>
                </div>
                <button @click="checkoutWhatsApp()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2">
                    Send Order to WhatsApp ➔
                </button>
            </div>
        </div>
    </div>

    <!-- 6. ADMIN DASHBOARD -->
    <div x-show="showAdminLogin" class="fixed inset-0 z-[110] flex items-center justify-center p-6 bg-black/90" x-cloak>
        <div class="bg-white w-full max-w-sm p-8 rounded-[40px]">
            <h2 class="serif text-2xl mb-6 text-center">Owner Login</h2>
            <input type="password" x-model="adminPassword" placeholder="Admin Password" class="admin-input text-center">
            <button @click="loginAdmin()" class="w-full bg-[#3E2723] text-white py-4 rounded-2xl font-bold">Login</button>
            <button @click="showAdminLogin = false" class="w-full mt-2 text-gray-400 text-xs">Cancel</button>
        </div>
    </div>

    <div x-show="isAdmin" class="fixed inset-0 z-[120] bg-white overflow-y-auto p-6" x-cloak>
        <div class="max-w-2xl mx-auto pb-20">
            <div class="flex justify-between items-center mb-8 border-b pb-4 sticky top-0 bg-white">
                <h2 class="serif text-2xl">Manage Website</h2>
                <button @click="isAdmin = false" class="bg-red-500 text-white px-5 py-2 rounded-full text-xs font-bold">Logout</button>
            </div>

            <!-- Add Item Section -->
            <div class="bg-gray-50 p-6 rounded-[30px] mb-10 border">
                <h3 class="font-bold text-pink-600 mb-4">Add New Product (Cake, Drink, etc.)</h3>
                <input type="text" x-model="newItem.name" placeholder="Item Name" class="admin-input">
                <input type="number" x-model="newItem.price" placeholder="Price (₹)" class="admin-input">
                
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <select x-model="newItem.category" class="admin-input">
                        <template x-for="cat in categories"><option :value="cat" x-text="cat"></option></template>
                    </select>
                    <select x-model="newItem.weight" class="admin-input">
                        <template x-for="w in weightOptions"><option :value="w" x-text="w"></option></template>
                    </select>
                </div>

                <div class="bg-white p-4 rounded-xl text-center border-2 border-dashed mb-4">
                    <p class="text-[10px] text-gray-400 font-bold mb-2">PICK IMAGE FROM GALLERY</p>
                    <input type="file" @change="handleFileUpload" class="text-xs">
                </div>
                <button @click="addItem()" class="w-full bg-[#3E2723] text-white py-4 rounded-2xl font-bold">Add to Shop</button>
            </div>

            <!-- Inventory Manager -->
            <h3 class="font-bold mb-4">Existing Inventory</h3>
            <div class="space-y-3">
                <template x-for="item in items" :key="item.id">
                    <div class="flex items-center gap-4 bg-white border p-3 rounded-2xl">
                        <img :src="item.image" class="w-12 h-12 rounded-lg object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-xs" x-text="item.name"></h4>
                            <p class="text-[10px] text-gray-400">₹<span x-text="item.price"></span> | <span x-text="item.category"></span></p>
                        </div>
                        <button @click="toggleStock(item.id)" :class="item.isOutOfStock ? 'bg-red-500':'bg-green-500'" class="text-white px-3 py-1 rounded-full text-[8px] font-bold" x-text="item.isOutOfStock ? 'OUT':'IN'"></button>
                        <button @click="deleteItem(item.id)" class="text-red-300">🗑️</button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-[#3E2723] text-white py-12 px-6 text-center">
        <h3 class="serif text-xl mb-4" x-text="site.brandName"></h3>
        <p class="text-xs text-gray-400 max-w-sm mx-auto" x-text="site.address"></p>
        <div class="mt-8 pt-8 border-t border-white/10 text-[8px] uppercase tracking-widest">© 2026 MomsBakery Najibabad</div>
    </footer>

    <script>
        function bakeryApp() {
            return {
                isAdmin: false, showAdminLogin: false, showCart: false,
                adminPassword: '', activeTab: 'Cakes', activeWeight: 'All Weights',
                cart: [],
                categories: ['Cakes', 'Drinks', 'Bouquets', 'Watches', 'Perfumes', 'Imported'],
                weightOptions: ['All Weights', '0.5 kg', '1 kg', '1.5 kg', '2 kg', '3 kg', 'Custom Weight'],

                site: {
                    brandName: 'MomsBakery',
                    heroTag: 'Najibabad’s Finest Bakery',
                    heroTitle: 'Handcrafted With Love',
                    heroSub: 'Fresh cakes and premium gifts for your special moments.',
                    phone: '918218250432',
                    address: 'Mota Aam, near Pooja Hospital, Najibabad, UP.'
                },

                items: [
                    { id: 1, name: 'Truffle Cake', price: 550, category: 'Cakes', weight: '0.5 kg', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80', isOutOfStock: false },
                ],

                newItem: { name: '', price: '', category: 'Cakes', weight: '0.5 kg', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80' },

                init() {
                    const saved = localStorage.getItem('moms_bakery_v4');
                    if(saved) this.items = JSON.parse(saved);
                },

                get filteredItems() {
                    return this.items.filter(item => {
                        const catMatch = item.category === this.activeTab;
                        const weightMatch = this.activeWeight === 'All Weights' || item.weight === this.activeWeight;
                        return catMatch && weightMatch;
                    });
                },

                loginAdmin() {
                    if(this.adminPassword === 'moms123') { this.isAdmin = true; this.showAdminLogin = false; this.adminPassword = ''; }
                    else alert('Access Denied');
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (f) => { this.newItem.image = f.target.result; };
                    reader.readAsDataURL(file);
                },

                addItem() {
                    if(!this.newItem.name || !this.newItem.price) return alert('Enter details');
                    this.items.push({ ...this.newItem, id: Date.now(), isOutOfStock: false });
                    this.save();
                    this.newItem.name = ''; this.newItem.price = '';
                },

                deleteItem(id) {
                    this.items = this.items.filter(i => i.id !== id);
                    this.save();
                },

                toggleStock(id) {
                    this.items.forEach(i => { if(i.id === id) i.isOutOfStock = !i.isOutOfStock; });
                    this.save();
                },

                save() { localStorage.setItem('moms_bakery_v4', JSON.stringify(this.items)); },

                addToCart(item) {
                    let existing = this.cart.find(i => i.id === item.id);
                    if(existing) existing.qty++;
                    else this.cart.push({ ...item, qty: 1 });
                    this.showCart = true;
                },

                updateQty(idx, amt) {
                    this.cart[idx].qty += amt;
                    if(this.cart[idx].qty < 1) this.cart.splice(idx, 1);
                },

                getCartTotal() { return this.cart.reduce((t, i) => t + (i.price * i.qty), 0); },
                cartCount() { return this.cart.reduce((t, i) => t + i.qty, 0); },

                checkoutWhatsApp() {
                    let msg = `*NEW ORDER: MomsBakery*\n------------------\n`;
                    this.cart.forEach(i => {
                        msg += `• ${i.name} (${i.weight})\n  Qty: ${i.qty} | Price: ₹${i.price * i.qty}\n`;
                    });
                    msg += `------------------\n*Total Bill: ₹${this.getCartTotal()}*\n\nAddress: ${this.site.address}`;
                    window.open(`https://wa.me/${this.site.phone}?text=${encodeURIComponent(msg)}`, '_blank');
                }
            }
        }
    </script>
</body>
</html>
