<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MomsBakery & Cake Corner | Premium Artisan Cakes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@11.0.3/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .premium-shadow { box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .cake-card:hover { transform: translateY(-10px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Since we are in a single file for iPhone ease, we use React via CDN
    </script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [cart, setCart] = useState([]);
            const [view, setView] = useState('home'); // home, shop, admin, cart
            const [activeCategory, setActiveCategory] = useState('All');

            const products = [
                { id: 1, name: "Gold Leaf Wedding Cake", price: 5500, cat: "Wedding", img: "https://images.unsplash.com/photo-1535254973040-607b474cb80d?w=800" },
                { id: 2, name: "Belgian Truffle Dream", price: 1200, cat: "Chocolate", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=800" },
                { id: 3, name: "Strawberry Bento Box", price: 450, cat: "Bento", img: "https://images.unsplash.com/photo-1562440499-64c9a111f713?w=800" },
                { id: 4, name: "Luxury Red Velvet", price: 1500, cat: "Birthday", img: "https://images.unsplash.com/photo-1616733148217-9dfd449f2391?w=800" },
                { id: 5, name: "Macaron Tower Cake", price: 3200, cat: "Designer", img: "https://images.unsplash.com/photo-1519340333755-56e9c1d04579?w=800" },
                { id: 6, name: "Blueberry Cheesecake", price: 1800, cat: "Fruit", img: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=800" }
            ];

            const categories = ["All", "Birthday", "Wedding", "Chocolate", "Bento", "Designer", "Fruit"];

            const addToCart = (p) => {
                setCart([...cart, p]);
                alert("Added to cart! 🎂");
            };

            const sendWhatsApp = () => {
                const text = `Hello MomsBakery! I want to order:\n${cart.map(i => `- ${i.name} (₹${i.price})`).join('\n')}\nTotal: ₹${cart.reduce((a,b) => a + b.price, 0)}`;
                window.open(`https://wa.me/REPLACE_WITH_YOUR_NUMBER?text=${encodeURIComponent(text)}`);
            };

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className="fixed top-0 w-full z-50 glass px-6 py-4 flex justify-between items-center">
                        <div className="text-xl font-bold italic text-[#3D1E14]">
                            MomsBakery <span className="text-[#D4AF37]">&</span> Cake Corner
                        </div>
                        <div className="flex items-center gap-6">
                            <button onClick={() => setView('home')} className="hidden md:block hover:text-[#D4AF37]">Home</button>
                            <button onClick={() => setView('shop')} className="hidden md:block hover:text-[#D4AF37]">Shop</button>
                            <div className="relative cursor-pointer" onClick={() => setView('cart')}>
                                <i data-lucide="shopping-bag"></i>
                                {cart.length > 0 && <span className="absolute -top-2 -right-2 bg-[#D4AF37] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{cart.length}</span>}
                            </div>
                            <button onClick={() => setView('admin')} className="text-xs text-gray-400">Admin</button>
                        </div>
                    </nav>

                    {view === 'home' && (
                        <main>
                            {/* Hero */}
                            <section className="h-screen flex items-center justify-center text-center px-4 pt-20">
                                <div className="max-w-4xl">
                                    <p className="text-[#D4AF37] font-bold tracking-[0.3em] mb-4 uppercase text-sm">Experience Pure Luxury</p>
                                    <h1 className="text-5xl md:text-8xl font-serif text-[#3D1E14] mb-8">Baking Memories <br/><span className="italic">Every Single Day</span></h1>
                                    <div className="flex flex-col md:flex-row gap-4 justify-center">
                                        <button onClick={() => setView('shop')} className="bg-[#3D1E14] text-white px-10 py-4 rounded-full text-lg font-semibold hover:bg-[#D4AF37] transition-all premium-shadow">Explore Collection</button>
                                        <button onClick={sendWhatsApp} className="bg-white border border-gray-200 text-[#3D1E14] px-10 py-4 rounded-full text-lg font-semibold hover:bg-[#F8E1E7] transition-all">WhatsApp Order</button>
                                    </div>
                                </div>
                            </section>

                            {/* Featured Grid */}
                            <section className="py-20 px-6 max-w-7xl mx-auto">
                                <h2 className="text-3xl font-serif mb-12 text-center">Our Signature Creations</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {products.slice(0, 3).map(p => (
                                        <div key={p.id} className="cake-card glass rounded-[2.5rem] p-4 premium-shadow">
                                            <img src={p.img} className="w-full h-80 object-cover rounded-[2rem] mb-6" />
                                            <h3 className="text-xl font-bold mb-2">{p.name}</h3>
                                            <div className="flex justify-between items-center">
                                                <span className="text-[#D4AF37] font-bold text-xl">₹{p.price}</span>
                                                <button onClick={() => addToCart(p)} className="bg-[#3D1E14] text-white p-3 rounded-2xl hover:bg-[#D4AF37]"><i data-lucide="plus"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </main>
                    )}

                    {view === 'shop' && (
                        <section className="pt-32 px-6 max-w-7xl mx-auto min-h-screen">
                            <div className="flex overflow-x-auto gap-4 mb-12 pb-4 no-scrollbar">
                                {categories.map(c => (
                                    <button 
                                        key={c}
                                        onClick={() => setActiveCategory(c)}
                                        className={`px-8 py-2 rounded-full border whitespace-nowrap transition-all ${activeCategory === c ? 'bg-[#3D1E14] text-white' : 'bg-white border-gray-200'}`}
                                    >
                                        {c}
                                    </button>
                                ))}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {products.filter(p => activeCategory === 'All' || p.cat === activeCategory).map(p => (
                                    <div key={p.id} className="cake-card glass rounded-[2.5rem] p-4 premium-shadow">
                                        <img src={p.img} className="w-full h-80 object-cover rounded-[2rem] mb-6" />
                                        <h3 className="text-xl font-bold mb-2">{p.name}</h3>
                                        <div className="flex justify-between items-center">
                                            <span className="text-[#D4AF37] font-bold text-xl">₹{p.price}</span>
                                            <button onClick={() => addToCart(p)} className="bg-[#3D1E14] text-white p-3 rounded-2xl">Add to Cart</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    )}

                    {view === 'cart' && (
                        <section className="pt-32 px-6 max-w-2xl mx-auto min-h-screen">
                            <h2 className="text-3xl font-serif mb-8">Your Cart ({cart.length})</h2>
                            {cart.length === 0 ? <p>Your cart is empty.</p> : (
                                <div className="space-y-4">
                                    {cart.map((item, index) => (
                                        <div key={index} className="glass p-4 rounded-2xl flex justify-between items-center">
                                            <div className="flex items-center gap-4">
                                                <img src={item.img} className="w-16 h-16 rounded-xl object-cover" />
                                                <div>
                                                    <h4 className="font-bold">{item.name}</h4>
                                                    <p className="text-[#D4AF37]">₹{item.price}</p>
                                                </div>
                                            </div>
                                            <button onClick={() => setCart(cart.filter((_, i) => i !== index))} className="text-red-500 underline">Remove</button>
                                        </div>
                                    ))}
                                    <div className="mt-10 p-6 glass rounded-3xl">
                                        <div className="flex justify-between text-xl font-bold mb-6">
                                            <span>Total Amount:</span>
                                            <span>₹{cart.reduce((a,b) => a+b.price, 0)}</span>
                                        </div>
                                        <button onClick={sendWhatsApp} className="w-full bg-[#3D1E14] text-white py-4 rounded-2xl font-bold text-lg">Order via WhatsApp</button>
                                    </div>
                                </div>
                            )}
                        </section>
                    )}

                    {view === 'admin' && (
                        <section className="pt-32 px-6 max-w-4xl mx-auto min-h-screen">
                            <div className="glass p-8 rounded-[2rem]">
                                <h2 className="text-2xl font-bold mb-6">Admin Dashboard</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                    <div className="bg-white p-4 rounded-2xl border">
                                        <p className="text-xs text-gray-500 uppercase">Sales</p>
                                        <p className="text-xl font-bold">₹42,000</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border">
                                        <p className="text-xs text-gray-500 uppercase">Orders</p>
                                        <p className="text-xl font-bold">12</p>
                                    </div>
                                </div>
                                <button className="bg-[#D4AF37] text-white px-6 py-2 rounded-lg font-bold">+ Add Product</button>
                            </div>
                        </section>
                    )}

                    {/* Footer */}
                    <footer className="bg-[#3D1E14] text-white py-20 px-6 mt-20">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12">
                            <div>
                                <h3 className="text-2xl font-serif mb-6">MomsBakery</h3>
                                <p className="text-gray-400">Premium artisan bakery serving luxury cakes and desserts for every occasion.</p>
                            </div>
                            <div>
                                <h4 className="font-bold mb-4">Contact</h4>
                                <p className="text-gray-400">@momsbakeryandcakecorner</p>
                                <p className="text-gray-400">WhatsApp: YOUR_NUMBER</p>
                            </div>
                            <div>
                                <h4 className="font-bold mb-4">Newsletter</h4>
                                <input type="email" placeholder="Enter email" className="bg-transparent border-b border-gray-600 w-full py-2 outline-none" />
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // Initialize Lucide Icons
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
